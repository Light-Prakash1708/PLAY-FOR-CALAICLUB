:root {
  --ink: #4A2E22; --ink-soft: #7A6257; --red: #E23B3F; --red-d: #B4282D; --orange: #F59E1B; --orange-d: #C97A08;
  --gold: #FFD24A; --sky: #96E0DA; --sky-d: #5FBFB8; --teal: #1F7A80; --card: #FFFFFF; --cream: #FFF8EC;
  --line: rgba(74, 46, 34, 0.12); --shadow: rgba(40, 70, 75, 0.28);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #2E6E72; overscroll-behavior: none; }
body { font-family: var(--body); font-weight: 700; color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(120% 90% at 50% 20%, #4FA3A6 0%, #2E6E72 60%, #235659 100%); }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: #8fcdf0; font-size: 20px; box-shadow: 0 0 80px rgba(0, 0, 0, 0.35); }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: absolute; inset: 0; }

/* ---------- shared pieces ---------- */
.screen { position: absolute; inset: 0; display: none; flex-direction: column; padding: calc(var(--sat) + 0.8em) 0.9em calc(var(--sab) + 0.8em); }
.screen.on { display: flex; animation: screenIn 0.32s cubic-bezier(.2, .9, .3, 1.1) both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(1.2em); } to { opacity: 1; transform: none; } }
.display { font-family: var(--display); font-weight: 400; letter-spacing: 0.03em; line-height: 0.95; }
svg.ic { width: 1em; height: 1em; display: block; fill: currentColor; flex: none; }

.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 0.4em; font-family: var(--display); font-size: 1.5em; letter-spacing: 0.05em;
  color: #fff; background: var(--red); border-radius: 0.55em; padding: 0.42em 1.1em 0.36em; min-height: 2.1em;
  box-shadow: 0 0.2em 0 var(--red-d), 0 0.45em 0.8em var(--shadow); transition: transform 0.08s, box-shadow 0.08s, filter 0.15s; }
.btn:active, .btn.pressed { transform: translateY(0.16em); box-shadow: 0 0.04em 0 var(--red-d), 0 0.15em 0.3em var(--shadow); }
.btn.white { background: #fff; color: var(--ink); box-shadow: 0 0.2em 0 #D5C9BF, 0 0.45em 0.8em var(--shadow); }
.btn.white:active { box-shadow: 0 0.04em 0 #D5C9BF, 0 0.15em 0.3em var(--shadow); }
.btn.orange { background: var(--orange); box-shadow: 0 0.2em 0 var(--orange-d), 0 0.45em 0.8em var(--shadow); }
.btn.orange:active { box-shadow: 0 0.04em 0 var(--orange-d), 0 0.15em 0.3em var(--shadow); }
.btn.teal { background: var(--teal); box-shadow: 0 0.2em 0 #145358, 0 0.45em 0.8em var(--shadow); }
.btn.small { font-size: 1.1em; min-height: 1.9em; padding: 0.35em 0.8em 0.3em; }
.btn.wide { width: 100%; }
.btn[disabled], .btn.off { filter: grayscale(0.85) opacity(0.6); pointer-events: none; }
.btn.off { pointer-events: auto; }
.ibtn { width: 2.3em; height: 2.3em; border-radius: 50%; background: #fff; color: var(--ink); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0.14em 0 #D5C9BF, 0 0.3em 0.6em var(--shadow); transition: transform 0.08s; flex: none; }
.ibtn:active { transform: translateY(0.12em) scale(0.96); }
.ibtn svg { font-size: 1.15em; }
.chip { display: inline-flex; align-items: center; gap: 0.35em; background: rgba(255, 255, 255, 0.92); border-radius: 2em; padding: 0.22em 0.7em 0.22em 0.3em;
  font-family: var(--display); font-size: 1.25em; letter-spacing: 0.04em; box-shadow: 0 0.12em 0 rgba(74, 46, 34, 0.1); }
.chip svg { font-size: 1.05em; }
.coin-ic { color: var(--orange); } .star-ic { color: var(--orange); }
.head { display: flex; align-items: center; gap: 0.6em; margin-bottom: 0.7em; }
.head h2 { font-family: var(--display); font-weight: 400; font-size: 2.1em; margin: 0; letter-spacing: 0.04em; color: #fff; text-shadow: 0 0.07em 0 rgba(74, 46, 34, 0.45); flex: 1; }
.card { background: var(--card); border-radius: 0.9em; box-shadow: 0 0.2em 0 rgba(74, 46, 34, 0.12), 0 0.5em 1.2em var(--shadow); }
.dark-text { color: var(--ink); }

/* ---------- loading ---------- */
#s-loading { align-items: center; justify-content: center; text-align: center; }
.logo { position: relative; color: #fff; text-shadow: 0 0.05em 0 var(--ink); }
.logo .l1, .logo .l2 { font-family: var(--display); display: block; line-height: 0.82; letter-spacing: 0.03em; }
.logo .l1 { font-size: 4.6em; color: #fff; }
.logo .l2 { font-size: 5.9em; color: var(--red); text-shadow: 0 0.045em 0 var(--ink); }
.logo-art { width: 12em; height: 5.2em; margin: 0 auto -0.4em; display: block; overflow: visible; }
.logo-art .path { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; opacity: 0.75; }
@keyframes dash { to { stroke-dashoffset: -36; } }
.logo-art .plane { animation: bob 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes bob { 50% { transform: translateY(-5px) rotate(-3deg); } }
.load-bar { position: relative; width: 72%; height: 0.8em; border-radius: 1em; background: rgba(255, 255, 255, 0.5); margin: 2.6em auto 0.9em; }
.load-fill { height: 100%; width: 0; border-radius: 1em; background: var(--red); transition: width 0.25s ease-out; }
.load-plane { position: absolute; top: 50%; left: 0; width: 2.2em; height: 2.2em; transform: translate(-50%, -50%); transition: left 0.25s ease-out; color: var(--red); filter: drop-shadow(0 0.1em 0 rgba(74, 46, 34, 0.3)); }
.load-plane svg { width: 100%; height: 100%; }
.load-pct { font-family: var(--display); font-size: 1.3em; color: var(--ink); }
.load-tip { min-height: 2.6em; margin: 0.9em 1.5em 0; font-size: 0.82em; color: var(--ink-soft); }
#s-loading .btn { margin-top: 0.6em; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
#s-loading.ready .btn { opacity: 1; pointer-events: auto; animation: pulse 1.3s ease-in-out infinite; }
#s-loading.ready .load-bar, #s-loading.ready .load-pct { opacity: 0; transition: opacity 0.2s; }
@keyframes pulse { 50% { transform: scale(1.05); } }

/* ---------- main menu ---------- */
.menu-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5em; }
.profile { display: flex; align-items: center; gap: 0.5em; background: rgba(255, 255, 255, 0.92); border-radius: 2em; padding: 0.22em 0.9em 0.22em 0.25em; box-shadow: 0 0.12em 0 rgba(74, 46, 34, 0.1); text-align: left; }
.profile .lvl { width: 2em; height: 2em; border-radius: 50%; background: var(--red); color: #fff; font-family: var(--display); font-size: 1.15em; display: flex; align-items: center; justify-content: center; }
.profile .rank { font-size: 0.68em; line-height: 1.1; }
.profile .xp { width: 5em; height: 0.3em; border-radius: 1em; background: var(--line); margin-top: 0.25em; overflow: hidden; }
.profile .xp i { display: block; height: 100%; background: var(--orange); border-radius: 1em; }
.menu-cur { display: flex; gap: 0.4em; }
.menu-logo { margin: auto 0 0; text-align: center; padding-top: 1.2em; }
.menu-logo .logo .l1 { font-size: 4.9em; } .menu-logo .logo .l2 { font-size: 6.3em; }
.menu-main { margin: 1.6em 0 auto; display: flex; flex-direction: column; gap: 0.75em; align-items: stretch; padding: 0 0.9em; }
.btn.play { font-size: 2.1em; flex-direction: column; gap: 0; padding: 0.38em 1em 0.3em; }
.btn.play small { font-family: var(--body); font-weight: 700; font-size: 0.34em; letter-spacing: 0.02em; opacity: 0.92; margin-top: 0.1em; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6em; }
.tile { position: relative; display: flex; align-items: center; gap: 0.55em; background: rgba(255, 255, 255, 0.95); border-radius: 0.8em; padding: 0.6em 0.7em; text-align: left;
  box-shadow: 0 0.18em 0 #D5C9BF, 0 0.4em 0.8em var(--shadow); transition: transform 0.08s; }
.tile:active { transform: translateY(0.14em); }
.tile .tic { width: 2.1em; height: 2.1em; border-radius: 0.6em; background: var(--sky); color: var(--teal); display: flex; align-items: center; justify-content: center; flex: none; }
.tile .tic svg { font-size: 1.3em; }
.tile b { font-family: var(--display); font-weight: 400; font-size: 1.3em; letter-spacing: 0.04em; display: block; line-height: 1; }
.tile span { font-size: 0.62em; color: var(--ink-soft); display: block; line-height: 1.15; margin-top: 0.15em; }
.tile .dot { position: absolute; top: -0.25em; right: -0.25em; width: 0.9em; height: 0.9em; border-radius: 50%; background: var(--red); border: 0.15em solid #fff; display: none; animation: pulse 1s infinite; }
.tile.notify .dot { display: block; }
.menu-foot { text-align: center; font-size: 0.6em; color: rgba(74, 46, 34, 0.6); margin-top: 0.8em; }

/* ---------- level select ---------- */
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; margin: 0 -0.3em; padding: 0.1em 0.3em 1em; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.lv { display: flex; align-items: stretch; gap: 0.7em; width: 100%; text-align: left; padding: 0.6em 0.7em; margin-bottom: 0.6em; transition: transform 0.08s; }
.lv:active { transform: translateY(0.12em); }
.lv .num { width: 2.5em; border-radius: 0.6em; background: var(--red); color: #fff; font-family: var(--display); font-size: 1.7em; display: flex; align-items: center; justify-content: center; flex: none; }
.lv.done .num { background: var(--teal); }
.lv.locked { background: rgba(255, 255, 255, 0.55); box-shadow: none; }
.lv.locked .num { background: #B9C9C8; }
.lv.locked .info { opacity: 0.6; }
.lv .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lv .brief, .lv .best { display: block; }
.lv .name { font-family: var(--display); font-size: 1.45em; letter-spacing: 0.04em; line-height: 1; display: flex; align-items: center; gap: 0.3em; }
.lv .name .ok { color: var(--teal); font-size: 0.75em; }
.lv .brief { font-size: 0.64em; color: var(--ink-soft); line-height: 1.25; margin: 0.2em 0 0.35em; }
.lv .meta { display: flex; align-items: center; gap: 0.7em; font-size: 0.68em; }
.pips { display: inline-flex; gap: 0.18em; }
.pips i { width: 0.5em; height: 0.5em; border-radius: 50%; background: var(--line); }
.pips i.on { background: var(--red); }
.lv .rew { display: inline-flex; align-items: center; gap: 0.2em; font-family: var(--display); font-size: 1.35em; }
.lv .side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; flex: none; }
.stars3 { display: inline-flex; gap: 0.08em; color: #E3D9D0; font-size: 1.05em; }
.stars3 .on { color: var(--orange); }
.lv .best { font-size: 0.58em; color: var(--ink-soft); }

/* ---------- sheets / modals ---------- */
.modal { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 1em; background: rgba(30, 60, 66, 0.55); z-index: 30; }
.modal.on { display: flex; animation: fade 0.18s both; }
#m-confirm { z-index: 40; }
@keyframes fade { from { opacity: 0; } }
.modal .panel { width: 100%; max-width: 24em; padding: 1.1em 1em 1em; animation: pop 0.28s cubic-bezier(.2, 1.3, .4, 1) both; max-height: 96%; overflow-y: auto; touch-action: pan-y; scrollbar-width: none; }
@keyframes pop { from { transform: scale(0.86); opacity: 0; } }
.panel h3 { font-family: var(--display); font-weight: 400; font-size: 2em; letter-spacing: 0.04em; margin: 0 0 0.3em; text-align: center; line-height: 1; }
.panel p { font-size: 0.78em; line-height: 1.35; color: var(--ink-soft); margin: 0.3em 0 0.8em; text-align: center; }
.panel .row { display: flex; gap: 0.6em; margin-top: 0.7em; }
.panel .row .btn { flex: 1; }
.panel .stack { display: flex; flex-direction: column; gap: 0.6em; margin-top: 0.8em; }
.brief-box { background: var(--cream); border-radius: 0.7em; padding: 0.6em 0.8em; margin: 0.6em 0; }
.brief-box .line { display: flex; justify-content: space-between; align-items: center; font-size: 0.74em; padding: 0.22em 0; }
.brief-box .line b { font-family: var(--display); font-weight: 400; font-size: 1.4em; letter-spacing: 0.03em; display: inline-flex; align-items: center; gap: 0.25em; }
.kicker { font-size: 0.64em; letter-spacing: 0.12em; color: var(--red); text-align: center; font-weight: 900; }

/* ---------- settings ---------- */
.set { display: flex; align-items: center; justify-content: space-between; gap: 0.8em; padding: 0.5em 0; border-bottom: 1px solid var(--line); font-size: 0.82em; }
.set:last-of-type { border-bottom: 0; }
.set label { flex: none; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 9.5em; height: 1.6em; background: none; margin: 0; touch-action: none; font-size: 1em; }
input[type=range]::-webkit-slider-runnable-track { height: 0.5em; border-radius: 1em; background: linear-gradient(to right, var(--red) var(--v, 50%), #E9DED5 var(--v, 50%)); }
input[type=range]::-moz-range-track { height: 0.5em; border-radius: 1em; background: #E9DED5; }
input[type=range]::-moz-range-progress { height: 0.5em; border-radius: 1em; background: var(--red); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 1.4em; height: 1.4em; margin-top: -0.45em; border-radius: 50%; background: #fff; border: 0.22em solid var(--red); box-shadow: 0 0.1em 0.2em rgba(0, 0, 0, 0.25); }
input[type=range]::-moz-range-thumb { width: 1em; height: 1em; border-radius: 50%; background: #fff; border: 0.22em solid var(--red); }
.toggle { width: 3em; height: 1.6em; border-radius: 1em; background: #D9CEC5; position: relative; transition: background 0.15s; flex: none; }
.toggle::after { content: ""; position: absolute; top: 0.18em; left: 0.18em; width: 1.24em; height: 1.24em; border-radius: 50%; background: #fff; box-shadow: 0 0.08em 0.15em rgba(0, 0, 0, 0.3); transition: transform 0.15s; }
.toggle.on { background: var(--teal); }
.toggle.on::after { transform: translateX(1.4em); }
.seg { display: inline-flex; background: #EFE6DE; border-radius: 0.6em; padding: 0.15em; }
.seg button { padding: 0.3em 0.7em; border-radius: 0.5em; font-size: 0.9em; }
.seg button.on { background: #fff; box-shadow: 0 0.08em 0.2em rgba(0, 0, 0, 0.18); color: var(--red); }
.link { font-size: 0.74em; color: var(--red); text-decoration: underline; padding: 0.5em; }

/* ---------- daily ---------- */
.days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4em; margin: 0.7em 0; }
.day { background: var(--cream); border-radius: 0.6em; padding: 0.4em 0.2em; text-align: center; font-size: 0.64em; border: 0.15em solid transparent; }
.day b { display: flex; align-items: center; justify-content: center; gap: 0.15em; font-family: var(--display); font-weight: 400; font-size: 1.7em; }
.day.today { border-color: var(--red); background: #fff; }
.day.got { opacity: 0.5; }
.day:last-child { grid-column: span 2; }

/* ---------- hangar ---------- */
#s-hangar { padding-bottom: calc(var(--sab) + 0.6em); }
.hg-stage { position: relative; flex: 1; min-height: 8em; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hg-stage canvas { width: 100%; height: 100%; position: absolute; inset: 0; touch-action: none; cursor: grab; }
.hg-disc { position: absolute; left: 50%; top: 54%; width: 62%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.18) 55%, rgba(255, 255, 255, 0) 70%); border: 0.12em dashed rgba(255, 255, 255, 0.8); animation: spin 26s linear infinite; }
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
.hg-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; }
.hg-nav.l { left: 0; } .hg-nav.r { right: 0; }
.hg-title { position: absolute; top: 0; left: 0; right: 0; text-align: center; pointer-events: none; }
.hg-title .n { font-family: var(--display); font-size: 2.4em; color: #fff; text-shadow: 0 0.06em 0 rgba(74, 46, 34, 0.5); letter-spacing: 0.04em; line-height: 1; }
.hg-title .r { display: inline-block; font-size: 0.62em; background: var(--ink); color: #fff; border-radius: 1em; padding: 0.15em 0.8em; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 0.3em; }
.hg-lock { position: absolute; bottom: 0.2em; left: 0; right: 0; text-align: center; font-size: 0.7em; color: var(--ink); pointer-events: none; }
.hg-lock span { background: rgba(255, 255, 255, 0.9); border-radius: 1em; padding: 0.25em 0.9em; display: inline-flex; align-items: center; gap: 0.35em; }
.thumbs { display: flex; gap: 0.4em; overflow-x: auto; padding: 0.3em 0.1em 0.5em; touch-action: pan-x; scrollbar-width: none; flex: none; }
.thumbs::-webkit-scrollbar { display: none; }
.thumb { position: relative; flex: none; width: 3.1em; height: 3.1em; border-radius: 0.7em; background: rgba(255, 255, 255, 0.6); border: 0.14em solid transparent; }
.thumb canvas { width: 100%; height: 100%; display: block; }
.thumb.cur { background: #fff; border-color: var(--red); }
.thumb .tag { position: absolute; right: -0.2em; bottom: -0.2em; width: 1.2em; height: 1.2em; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.7em; }
.thumb .tag.sel { background: var(--teal); }
.hg-panel { flex: none; padding: 0.7em 0.8em 0.8em; }
.tabs { display: flex; background: #EFE6DE; border-radius: 0.6em; padding: 0.15em; margin-bottom: 0.6em; }
.tabs button { flex: 1; font-family: var(--display); font-size: 1.15em; letter-spacing: 0.05em; padding: 0.28em 0 0.22em; border-radius: 0.5em; color: var(--ink-soft); }
.tabs button.on { background: #fff; color: var(--red); box-shadow: 0 0.08em 0.2em rgba(0, 0, 0, 0.18); }
.hg-desc { font-size: 0.68em; color: var(--ink-soft); line-height: 1.3; min-height: 2.6em; margin-bottom: 0.4em; }
.stat { display: grid; grid-template-columns: 5.2em 1fr 2.6em; align-items: center; gap: 0.5em; font-size: 0.68em; padding: 0.16em 0; }
.stat .bar { position: relative; height: 0.62em; border-radius: 1em; background: #EFE6DE; overflow: visible; }
.stat .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 1em; background: var(--teal); transition: width 0.3s; }
.stat .bar i.gain { background: var(--orange); opacity: 0.75; }
.stat .bar u { position: absolute; top: -0.2em; bottom: -0.2em; width: 0.16em; background: var(--ink); border-radius: 1em; opacity: 0.55; }
.stat .val { font-family: var(--display); font-size: 1.4em; text-align: right; }
.stat .val.up { color: var(--teal); } .stat .val.down { color: var(--red); }
.hg-special { font-size: 0.64em; color: var(--ink-soft); margin: 0.35em 0 0.1em; }
.hg-special b { color: var(--ink); }
.hg-action { margin-top: 0.6em; }
.upg { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.6em; padding: 0.32em 0; border-bottom: 1px solid var(--line); }
.upg:last-child { border-bottom: 0; }
.upg .t { font-family: var(--display); font-size: 1.1em; letter-spacing: 0.04em; display: flex; align-items: center; gap: 0.5em; line-height: 1; }
.upg .d { font-size: 0.6em; color: var(--ink-soft); margin-top: 0.2em; }
.upg .d b { color: var(--teal); }
.upips { display: inline-flex; gap: 0.16em; }
.upips i { width: 0.75em; height: 0.36em; border-radius: 0.2em; background: #E6DBD2; }
.upips i.on { background: var(--orange); }
.upg .btn { min-width: 4.6em; }
.upg .btn svg { font-size: 0.85em; }
.upg.flash { animation: upflash 0.5s; }
@keyframes upflash { 30% { background: #FFF1CF; } }

/* ---------- HUD ---------- */
#s-hud { padding: 0; pointer-events: none; animation: none; }
#s-hud > * { pointer-events: auto; }
.hud-top { position: absolute; top: calc(var(--sat) + 0.55em); left: 0.8em; right: 0.8em; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; pointer-events: none !important; color: var(--ink); }
.dark .hud-top, .dark .hud-obj { color: #fff; text-shadow: 0 0.05em 0.18em rgba(20, 20, 30, 0.75); }
.hud-time { font-family: var(--display); font-size: 2.3em; line-height: 0.9; letter-spacing: 0.02em; }
.hud-hp { display: flex; align-items: center; gap: 0.3em; margin-top: 0.35em; }
.hud-hp svg { font-size: 0.9em; color: var(--red); }
.hpbar { width: 6.4em; height: 0.62em; border-radius: 1em; background: rgba(74, 46, 34, 0.25); overflow: hidden; border: 0.1em solid rgba(255, 255, 255, 0.85); box-sizing: content-box; }
.hpbar i { display: block; height: 100%; width: 100%; background: #3DBE6C; border-radius: 1em; transition: width 0.18s, background 0.3s; }
.hpbar.mid i { background: var(--orange); } .hpbar.low i { background: var(--red); }
.hpbar.low { animation: hpblink 0.6s infinite; }
@keyframes hpblink { 50% { border-color: var(--red); } }
.hud-bst { display: flex; align-items: center; gap: 0.3em; margin-top: 0.25em; }
.hud-bst svg { font-size: 0.9em; color: #3D7BE8; }
.bstbar { width: 4.6em; height: 0.4em; border-radius: 1em; background: rgba(74, 46, 34, 0.25); overflow: hidden; border: 0.1em solid rgba(255, 255, 255, 0.85); box-sizing: content-box; }
.bstbar i { display: block; height: 100%; width: 100%; background: #9DB4D6; border-radius: 1em; transition: width 0.1s linear; }
.bstbar.full i { background: #3D7BE8; }
.hud-pause { pointer-events: auto !important; width: 2.9em; height: 2.9em; border-radius: 50%; background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 0.16em 0 var(--red-d); transition: transform 0.08s; }
.hud-pause:active { transform: translateY(0.12em); }
.hud-pause svg { font-size: 1.35em; }
.hud-right { text-align: right; }
.hud-score { font-family: var(--display); font-size: 2.3em; line-height: 0.9; }
.hud-coins { display: inline-flex; align-items: center; gap: 0.25em; font-family: var(--display); font-size: 1.25em; margin-top: 0.2em; }
.hud-obj { position: absolute; top: calc(var(--sat) + 5.3em); left: 0.8em; right: 0.8em; display: flex; justify-content: space-between; align-items: center; pointer-events: none !important; color: var(--ink); opacity: 0.92; }
.hud-obj span { font-size: 0.66em; }
.hud-obj b { font-family: var(--display); font-weight: 400; font-size: 1.05em; letter-spacing: 0.04em; }
.boss { position: absolute; top: calc(var(--sat) + 6.9em); left: 12%; right: 12%; display: none; pointer-events: none !important; text-align: center; }
.boss.on { display: block; animation: screenIn 0.4s both; }
.boss .bn { font-family: var(--display); font-size: 1.1em; letter-spacing: 0.14em; color: #fff; text-shadow: 0 0.08em 0 rgba(0, 0, 0, 0.45); }
.boss .bb { height: 0.8em; border-radius: 1em; background: rgba(40, 20, 20, 0.5); border: 0.12em solid #fff; overflow: hidden; margin-top: 0.15em; }
.boss .bb i { display: block; height: 100%; background: linear-gradient(#FF6A5E, #D6282D); transition: width 0.15s; }
.chips { position: absolute; left: 0; right: 0; bottom: calc(var(--sab) + 11.2em); display: flex; justify-content: center; gap: 0.4em; pointer-events: none !important; }
.pchip { display: none; align-items: center; gap: 0.3em; background: rgba(255, 255, 255, 0.92); border-radius: 1em; padding: 0.15em 0.6em 0.15em 0.3em; font-family: var(--display); font-size: 0.95em; letter-spacing: 0.05em; }
.pchip.on { display: inline-flex; }
.pchip svg { font-size: 1em; }
.banner { position: absolute; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none !important; display: none; }
.banner.on { display: block; animation: bannerIn 0.45s cubic-bezier(.2, 1.2, .4, 1) both; }
.banner.out { animation: bannerOut 0.3s both; }
@keyframes bannerIn { from { opacity: 0; transform: scale(1.5); } }
@keyframes bannerOut { to { opacity: 0; transform: translateY(-1em); } }
.banner .b1 { font-family: var(--display); font-size: 3.4em; color: #fff; text-shadow: 0 0.06em 0 var(--ink); letter-spacing: 0.05em; line-height: 0.95; }
.banner .b2 { display: inline-block; font-size: 0.74em; letter-spacing: 0.14em; background: var(--ink); color: #fff; padding: 0.2em 1em; border-radius: 1em; margin-top: 0.4em; }
.banner.danger .b1 { color: var(--red); text-shadow: 0 0.06em 0 #fff; animation: warn 0.5s steps(2) infinite; }
.banner.danger .b2 { background: var(--red); }
@keyframes warn { 50% { opacity: 0.45; } }
.hint { position: absolute; left: 8%; right: 8%; top: 38%; text-align: center; pointer-events: none !important; opacity: 0; transition: opacity 0.3s; }
.hint.on { opacity: 1; }
.hint span { display: inline-block; background: rgba(74, 46, 34, 0.86); color: #fff; font-size: 0.76em; padding: 0.5em 1em; border-radius: 1.2em; line-height: 1.25; }
.joy-zone { position: absolute; left: 0; bottom: 0; width: 58%; height: 46%; touch-action: none; }
.joy { position: absolute; left: 6.3em; top: calc(100% - var(--sab) - 6.3em); width: 9em; height: 9em; margin: -4.5em 0 0 -4.5em; border-radius: 50%; border: 0.14em solid rgba(255, 255, 255, 0.75); background: rgba(255, 255, 255, 0.14); pointer-events: none; transition: opacity 0.2s; }
.joy.active { background: rgba(255, 255, 255, 0.22); }
.joy .knob { position: absolute; inset: 22%; border-radius: 50%; border: 0.14em solid #fff; background: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center; }
.acts { position: absolute; right: 0.9em; bottom: calc(var(--sab) + 1.3em); width: 14.8em; height: 11.2em; pointer-events: none !important; }
.act { position: absolute; border-radius: 50%; pointer-events: auto; touch-action: none; display: flex; align-items: center; justify-content: center; color: #fff; transition: transform 0.07s;
  background: conic-gradient(rgba(255, 255, 255, 0.95) calc(var(--p, 1) * 360deg), rgba(255, 255, 255, 0.28) 0); }
.act::before { content: ""; position: absolute; inset: 0.22em; border-radius: 50%; background: var(--c, var(--red)); box-shadow: inset 0 -0.2em 0 rgba(0, 0, 0, 0.18); }

.act.fire { right: 0; bottom: 0; width: 5.6em; height: 5.6em; --c: var(--red); }

@keyframes alert { 50% { transform: scale(1.12); box-shadow: 0 0 0 0.25em rgba(226, 59, 63, 0.7); } }
.warn { position: absolute; top: 31%; left: 50%; transform: translateX(-50%); display: none; pointer-events: none !important; background: var(--red); color: #fff; font-family: var(--display); font-size: 1.2em; letter-spacing: 0.16em; padding: 0.12em 0.9em 0.04em; border-radius: 0.4em; }

.act.fire.auto::after { content: "AUTO"; position: absolute; top: -0.1em; left: -0.5em; background: #fff; color: var(--red); font-family: var(--display); font-size: 0.7em; letter-spacing: 0.08em; padding: 0.05em 0.5em 0; border-radius: 1em; }
.hud-hide .warn, .hud-hide .joy-zone, .hud-hide .acts, .hud-hide .chips, .hud-hide .hud-pause { opacity: 0; pointer-events: none !important; transition: opacity 0.3s; }

/* ---------- pause / results ---------- */
.overlay { background: rgba(30, 60, 66, 0.6); align-items: center; justify-content: center; z-index: 20; }
.overlay .panel { width: 100%; max-width: 22em; padding: 1.2em 1.1em; }

.defeat-art { width: 6em; height: 4.4em; margin: 0 auto 0.2em; display: block; overflow: visible; }

@keyframes fall { 0% { transform: translate(-30px, -22px) rotate(20deg); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(26px, 24px) rotate(50deg); opacity: 0; } }

/* ---------- toast ---------- */

@media (prefers-reduced-motion: reduce) {
  .screen.on, .modal .panel, .banner.on { animation-duration: 0.01s; }

}

.bres-score .blue { color: var(--blue); } .bres-score .red { color: var(--redt); } .bres-score i { font-style: normal; color: var(--ink-soft); font-size: 0.6em; }

.bres-board table { width: 100%; border-collapse: collapse; font-size: 0.72em; }
.bres-board th { font-family: var(--display); font-weight: 400; letter-spacing: 0.1em; color: var(--ink-soft); text-align: right; padding: 0.2em 0.3em; }
.bres-board th:first-child, .bres-board td:first-child { text-align: left; }
.bres-board td { text-align: right; padding: 0.18em 0.3em; font-weight: 900; }
.bres-board tr.t0 td:first-child { border-left: 0.25em solid var(--blue); padding-left: 0.4em; }
.bres-board tr.t1 td:first-child { border-left: 0.25em solid var(--redt); padding-left: 0.4em; }
.bres-board tr.me td { background: rgba(255, 210, 74, 0.35); }

.res-note svg { display: inline-block; vertical-align: -0.12em; color: var(--orange); }

/* ======================================================================
   LANDSCAPE (laptops, tablets, phones on their side)
   Menus stay a comfortable column in the middle; the game uses the full width.
   ====================================================================== */
#app.land .screen:not(#s-hud):not(#s-battle):not(#s-intro):not(.overlay) { left: calc(50% - 15.5em); right: auto; width: 31em; }

#app.land .bs-maps { grid-template-columns: repeat(4, 1fr); }
#app.land .bt-top { left: 9em; right: 9em; }
#app.land .bt-map { width: 7.4em; height: 7.4em; }
#app.land .bt-feed { top: calc(var(--sat) + 11.2em); }
#app.land.short .menu-logo { display: none; }
#app.land.short .menu-main { margin-top: 0.4em; }
#app.land .acts, #app.land .bt-acts { right: 1.6em; }
#app.land .joy { left: 7.5em; }
#app.land .bs-go { font-size: 1.8em; }
#app.land #s-battle.two .bt-panel.p1 { top: calc(var(--sat) + 11.4em); }
#app.land #s-battle.two .bt-feed { top: calc(var(--sat) + 5.8em); right: auto; left: 50%; transform: translateX(-50%); align-items: center; }
#app.land .menu-logo .logo { font-size: 0.68em; }
#app.land .menu-main { margin-top: 0.8em; }

/* ---------- v5: single-player battle, shield, controls, invites ---------- */
.bs-challenge { padding: 0.6em 0.8em; margin-bottom: 0.5em; font-size: 0.78em; line-height: 1.35; border-left: 0.3em solid var(--orange); }
.bs-challenge .kicker { text-align: left; color: var(--orange-d); }
.bs-pilot { display: flex; align-items: center; gap: 0.6em; padding: 0.5em 0.7em; flex-wrap: wrap; }
.bs-name { display: flex; align-items: center; gap: 0.5em; flex: 1; min-width: 12em; }
.bs-name span { font-family: var(--display); letter-spacing: 0.1em; color: var(--ink-soft); }
.bs-name input { flex: 1; min-width: 0; font: inherit; font-family: var(--display); font-size: 1.3em; letter-spacing: 0.06em; color: var(--ink); border: 0; border-bottom: 0.12em solid var(--line); background: transparent; padding: 0.1em 0.2em; outline: none; text-transform: uppercase; -webkit-user-select: text; user-select: text; touch-action: manipulation; }
.bs-name input:focus { border-bottom-color: var(--red); }
.bs-plane { font-size: 0.72em; color: var(--ink-soft); text-align: left; text-shadow: none; margin: 0; }
.bs-plane b { color: var(--ink); }
.bs-plane .link { color: var(--red); padding: 0 0.3em; font-size: 1em; }
.bs-map { height: 4.4em; flex-direction: column; align-items: flex-start; justify-content: flex-end; text-align: left; }
.bs-map span { font-size: 0.56em; opacity: 0.92; text-shadow: 0 0.06em 0.2em rgba(0, 0, 0, 0.7); line-height: 1.2; }
.m-ocean { background: radial-gradient(30% 40% at 30% 40%, #f3e2a8 0 30%, #7fd3d6 31% 45%, transparent 46%), radial-gradient(25% 30% at 75% 70%, #e8d8a0 0 30%, #7fd3d6 31% 45%, transparent 46%), linear-gradient(135deg, #2f8cc8, #155a8a); }
.m-city { background: repeating-linear-gradient(0deg, transparent 0 18%, #545b66 18% 24%), repeating-linear-gradient(90deg, #a3a9b3 0 18%, #545b66 18% 24%); }
.m-lava { background: radial-gradient(40% 60% at 60% 50%, #ffcf6a, #ff6a12 30%, transparent 60%), linear-gradient(135deg, #3a2426, #160d10); }
#app.land .bs-maps { grid-template-columns: repeat(3, 1fr); }
.bs-row { display: flex; gap: 0.5em; margin-top: 0.6em; }
.bs-row .btn { flex: 1; font-size: 1em; }
.bs-row .btn svg { font-size: 0.9em; }
/* HUD */
.bp-bar.sh i { background: #7FD8FF; width: 0; }
.bp-bar.sh.on i { background: #E8FBFF; box-shadow: 0 0 0.5em #7FD8FF; }
.bt-ctl .joy-zone { width: 60%; height: 64%; }
.joy-tip { position: absolute; left: 6.3em; top: calc(100% - var(--sab) - 1.2em); transform: translateX(-50%); font-family: var(--display); font-size: 0.8em; letter-spacing: 0.14em; color: #fff; opacity: 0.75; pointer-events: none; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); transition: opacity 0.2s; white-space: nowrap; }
#app.land .joy-tip { left: 7.5em; }
.joy.active + .joy-tip { opacity: 0; }
.act.shieldb { right: 0.9em; bottom: 6.9em; width: 4.1em; height: 4.1em; --c: #23A6D9; }
.act.shieldb.active::before { background: #E8FBFF; box-shadow: 0 0 1em #7FD8FF; }
.act.shieldb.active svg { color: #1F7A9C; }
.act.shieldb.alert { animation: alert 0.42s steps(2) infinite; }
.bt-acts .act.cool::after { content: ""; position: absolute; inset: 0.22em; border-radius: 50%; background: conic-gradient(transparent calc(var(--p, 1) * 360deg), rgba(0, 0, 0, 0.45) 0); pointer-events: none; }
.act .mode { position: absolute; top: -0.25em; left: -0.4em; background: #fff; color: var(--red); font-family: var(--display); font-size: 0.7em; letter-spacing: 0.08em; padding: 0.08em 0.5em 0; border-radius: 1em; box-shadow: 0 0.08em 0.15em rgba(0, 0, 0, 0.3); }
.act.fire.latched::before { box-shadow: 0 0 0 0.25em #FFD24A, inset 0 -0.2em 0 rgba(0, 0, 0, 0.18); }
.act.fire.firing.automode::before { filter: brightness(1.15); }
.bt-keys { position: absolute; left: 50%; bottom: calc(var(--sab) + 0.7em); transform: translateX(-50%); display: flex; gap: 0.5em; pointer-events: none !important; flex-wrap: wrap; justify-content: center; }
.bt-keys span { display: flex; align-items: center; gap: 0.3em; background: rgba(10, 12, 24, 0.5); border-radius: 0.5em; padding: 0.2em 0.5em 0.2em 0.25em; font-size: 0.62em; letter-spacing: 0.08em; font-weight: 900; }
.bt-keys kbd { font-family: var(--display); font-size: 1.25em; background: #fff; color: var(--ink); border-radius: 0.3em; padding: 0.05em 0.4em 0; min-width: 1.3em; text-align: center; box-shadow: 0 0.12em 0 #b9ada3; }
#s-battle.over .bt-keys, #s-battle.intro .bt-keys { opacity: 0; }
/* results + invite */
.bres-vs { display: none; text-align: center; margin: -0.1em 0 0.5em; font-size: 0.8em; padding: 0.35em; border-radius: 0.6em; background: var(--cream); }
.bres-vs.on { display: block; }
.bres-vs b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.5em; letter-spacing: 0.06em; }
.bres-vs.good b { color: var(--teal); } .bres-vs.bad b { color: var(--red); }
.iv-link { width: 100%; font: inherit; font-size: 0.7em; padding: 0.6em; border-radius: 0.5em; border: 0.1em solid var(--line); background: var(--cream); color: var(--ink); -webkit-user-select: all; user-select: all; }
.iv-note { color: var(--orange-d) !important; font-size: 0.66em !important; }
/* controls dialog */
#m-controls .panel { max-width: 26em; }
.ct-label { font-family: var(--display); letter-spacing: 0.12em; color: var(--red); margin: 0.6em 0 0.3em; font-size: 1em; }
.ct-label span { font-family: var(--body); font-size: 0.6em; letter-spacing: 0; color: var(--ink-soft); margin-left: 0.4em; }
.ct-seg { background: var(--cream); }
.ct-desc { font-size: 0.68em !important; margin: 0.35em 0 0.5em !important; }
.ct-keys { background: var(--cream); border-radius: 0.7em; padding: 0.3em 0.5em; }
.ct-row { display: grid; grid-template-columns: 1fr 4.4em 4.4em; gap: 0.35em; align-items: center; padding: 0.18em 0; font-size: 0.74em; }
.ct-key { font-family: var(--display); font-size: 1.2em; letter-spacing: 0.04em; background: #fff; border-radius: 0.4em; padding: 0.2em 0 0.1em; box-shadow: 0 0.12em 0 #D5C9BF; color: var(--ink); }
.ct-key.none { color: #C9BDB3; }
.ct-key.listen { background: var(--red); color: #fff; font-size: 0.8em; animation: warn 0.6s steps(2) infinite; }
.bs-size button { display: flex; flex-direction: column; align-items: center; line-height: 1; padding: 0.35em 0 0.3em; }
.bs-size button small { font-family: var(--body); font-weight: 700; font-size: 0.48em; letter-spacing: 0; color: var(--ink-soft); margin-top: 0.25em; }

/* ---------- v6: radio comms, campaign radar ---------- */
.radio { position: absolute; left: 0.4em; top: calc(var(--sat) + 8.2em); width: min(19em, 72%); display: flex; gap: 0.15em; align-items: flex-end; pointer-events: none; z-index: 12;
  opacity: 0; transform: translateX(-1.2em); transition: opacity 0.25s, transform 0.3s cubic-bezier(.2, 1.3, .4, 1); }
.radio.on { opacity: 1; transform: none; }
.rd-fig { flex: none; width: 4.2em; height: 4.6em; filter: drop-shadow(0 0.15em 0.2em rgba(0, 0, 0, 0.45)); }
.pf-svg { width: 100%; height: 100%; overflow: visible; }
.pf-body { animation: pfBob 2.6s ease-in-out infinite; transform-origin: 50px 105px; }
@keyframes pfBob { 50% { transform: translateY(-1.5px) rotate(-1.5deg); } }
.pf-eyes { animation: pfBlink 3.8s infinite; transform-origin: 50px 55px; }
@keyframes pfBlink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
.pf-mouth { transform-origin: 50px 69px; transform: scaleY(0.45); }
.radio.talk .pf-mouth { animation: pfTalk 0.16s ease-in-out infinite alternate; }
@keyframes pfTalk { from { transform: scaleY(0.3); } to { transform: scaleY(1.25); } }
.radio.talk .pf-head { animation: pfNod 0.5s ease-in-out infinite alternate; transform-origin: 50px 80px; }
@keyframes pfNod { to { transform: rotate(2deg) translateY(0.5px); } }
.pf-arm { transform-origin: 24px 94px; transform: rotate(75deg); opacity: 0; }
.rd-fig.salute .pf-arm { animation: pfSalute 1.7s ease-in-out both; }
@keyframes pfSalute { 0% { transform: rotate(75deg); opacity: 0; } 15% { opacity: 1; } 30%, 70% { transform: rotate(0deg); opacity: 1; } 100% { transform: rotate(75deg); opacity: 0; } }
.rd-bubble { position: relative; flex: 1; min-width: 0; background: #FFFFFF; color: #1B1F2A; border-radius: 0.8em; padding: 0.38em 0.65em 0.42em; margin-bottom: 1.1em; box-shadow: 0 0.18em 0.6em rgba(0, 0, 0, 0.3); border: 0.12em solid var(--c, #2FB8A8); }
.rd-bubble::before { content: ""; position: absolute; left: -0.55em; bottom: 0.7em; border: 0.32em solid transparent; border-right: 0.5em solid var(--c, #2FB8A8); }
.rd-bubble::after { content: ""; position: absolute; left: -0.36em; bottom: 0.78em; border: 0.24em solid transparent; border-right: 0.38em solid #fff; }
.radio.enemy .rd-bubble { background: #2A0E12; color: #FFE5E2; }
.radio.enemy .rd-bubble::after { border-right-color: #2A0E12; }
.rd-name { display: flex; align-items: baseline; gap: 0.4em; line-height: 1; }
.rd-name b { font-family: var(--display); font-weight: 400; font-size: 0.9em; letter-spacing: 0.08em; color: var(--c, #2FB8A8); }
.rd-name em { font-style: normal; font-size: 0.55em; opacity: 0.7; letter-spacing: 0.06em; }
.rd-text { font-size: 0.68em; line-height: 1.3; margin-top: 0.15em; min-height: 1.3em; font-weight: 800; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cp-map { top: calc(var(--sat) + 6.9em) !important; width: 6em !important; height: 6em !important; pointer-events: none; }
#app.land .cp-map { width: 7em !important; height: 7em !important; }
.brief-act { text-align: center; font-size: 0.56em; letter-spacing: 0.14em; color: var(--ink-soft); font-weight: 900; margin: -0.2em 0 0.2em; }
.brief-quote { background: #12161f; color: #fff; border-radius: 0.6em; padding: 0.5em 0.7em; font-size: 0.72em; line-height: 1.35; margin: 0 0 0.7em; border-left: 0.25em solid #2FB8A8; font-style: italic; }
.brief-quote b { display: block; font-family: var(--display); font-weight: 400; font-style: normal; letter-spacing: 0.08em; font-size: 1.15em; }
.bt-viewbtn { position: absolute; top: calc(var(--sat) + 0.5em); right: 3.4em; width: 2.5em; height: 2.5em; border-radius: 50%; background: rgba(10, 12, 24, 0.6); color: #fff; display: flex; align-items: center; justify-content: center; border: 0.12em solid rgba(255, 255, 255, 0.6); }
.bt-viewbtn b { font-family: var(--display); font-weight: 400; font-size: 0.85em; letter-spacing: 0.05em; }
#s-battle .bt-top { right: 6.2em; }
#app.land #s-battle .bt-top { right: 9em; }
#s-battle.cockpit .bt-keys { bottom: calc(var(--sab) + 14%); }
#s-battle.over .bt-viewbtn, #s-battle.intro .bt-viewbtn { opacity: 0.3; }

/* ---------- v6: opening cinematic ---------- */
.load-sound { display: flex; align-items: center; justify-content: center; gap: 0.4em; font-size: 0.68em; letter-spacing: 0.16em; color: var(--ink-soft); margin-top: 0.4em; }
.load-sound svg { font-size: 1.2em; }
#s-intro { align-items: center; justify-content: center; text-align: center; pointer-events: none; animation: none; }
#s-intro .it-skip { pointer-events: auto; position: absolute; right: 1em; bottom: calc(var(--sab) + 1em); font-family: var(--display); font-size: 1.1em; letter-spacing: 0.12em; color: #fff; display: flex; align-items: center; gap: 0.3em; background: rgba(0, 0, 0, 0.35); padding: 0.35em 0.8em 0.25em; border-radius: 2em; }
.it-line { position: absolute; left: 0; right: 0; top: 40%; font-family: var(--display); font-size: 2.2em; letter-spacing: 0.12em; color: #fff; opacity: 0; text-shadow: 0 0.06em 0.4em rgba(0, 0, 0, 0.6); padding: 0 0.6em; }
.it-line.l1 { animation: itLine 2s 0.6s both; }
.it-line.l2 { animation: itLine 1.9s 2.6s both; color: #FFB4A8; }
.it-line.l3 { animation: itLine 1.5s 4.4s both; }
@keyframes itLine { 0% { opacity: 0; transform: translateY(0.5em); letter-spacing: 0.3em; } 20% { opacity: 1; transform: none; letter-spacing: 0.12em; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-0.3em); } }
.it-logo { opacity: 0; animation: itLogo 2.6s 5.9s both; }
@keyframes itLogo { 0% { opacity: 0; transform: scale(2.4); filter: blur(6px); } 18% { opacity: 1; transform: scale(0.94); filter: none; } 30% { transform: scale(1); } 100% { opacity: 1; transform: scale(1.04); } }
.it-op { font-family: var(--display); font-size: 1.3em; letter-spacing: 0.4em; color: #fff; margin-top: 0.4em; text-shadow: 0 0.06em 0.3em rgba(0, 0, 0, 0.6); }
#s-loading .logo .l1 { text-shadow: 0 0.05em 0 #0b1230; }
#s-loading .load-pct, #s-loading .load-tip, #s-loading .load-sound { color: rgba(255, 255, 255, 0.88); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5); }
#s-loading { justify-content: flex-start; padding-top: calc(var(--sat) + 8%); }

/* ---------- v7: message lanes (nothing stacks on top of anything else) ----------
   top-left  : pilot panel, then the radio pilot + speech bubble
   top-right : radar, then the kill feed
   30%       : big banners (mission, zone, final 30 s)
   40%       : countdown / missile-lock pill / "shot down" card
   centre    : your jet - always kept clear
   60%       : kill callouts (just below the jet)
   68%       : hints
   bottom    : controls                                                          */
.banner, #s-battle .banner { top: 29%; }
.banner .b1 { font-size: 2.7em; }
.banner .b2 { font-size: 0.66em; }
.bt-count { top: 36%; font-size: 5em; }
.warn, #s-battle .warn { top: 40%; font-size: 1em; }
.bt-down { top: 38%; }
.bt-call { top: 60%; font-size: 1.9em; }
.bt-call.small { font-size: 1.2em; }
.hint, #s-battle .hint { top: 68%; }
.hint span { font-size: 0.7em; }
#app.land .radio { width: min(17em, 30%); }
#app.land .banner .b1 { font-size: 3em; }
/* the intro's control help sits low, above the controls, never on the jet */
.bt-help { bottom: 24%; }
/* the radio leaves room for the HUD on short landscape phones */
#app.land.short .radio { top: calc(var(--sat) + 7.6em); width: min(15em, 32%); }
#app.land.short .rd-fig { width: 3.4em; height: 3.8em; }
.banner .b1 { width: fit-content; margin: 0 auto; }
.banner { pointer-events: none !important; }
#app.land .banner, #app.land #s-battle .banner { top: 20%; }
#app.land .warn, #app.land #s-battle .warn { top: 42.5%; }
#app.land .bt-count { top: 30%; }
#app.land.short .banner, #app.land.short #s-battle .banner { top: 25%; }
#app.land.short .banner .b1 { font-size: 2.6em; }
#app.land.short .warn, #app.land.short #s-battle .warn { top: 46%; }
.rd-fig { width: 4.8em; height: 5.2em; }

/* ---------- v7: decluttered HUD ---------- */
.bt-panel .r-bst { display: none; }
#s-battle.touch .bt-panel .r-sh { display: none; }
.bt-zone.quiet { display: none; }
.bt-keys { transition: opacity 0.8s; }
.bt-keys.faded { opacity: 0; }
.bt-feed div { font-size: 0.72em; }
.bt-map { width: 6em; height: 6em; }
.bt-feed { top: calc(var(--sat) + 9.8em); }
.bt-score { background: rgba(10, 12, 24, 0.42); }
.bt-panel { background: rgba(10, 12, 24, 0.38); width: 6.2em; }

/* ---- online: play with a friend ---- */
#m-online .panel { max-width: 25em; }
#m-online h3 { display: flex; align-items: center; justify-content: center; gap: .4em; }
#m-online h3 svg { width: 1em; height: 1em; }
.on-sub { text-align: center; font-size: .74em; color: var(--ink-soft); margin: .2em 0 .7em; }
.on-modes { display: grid; grid-template-columns: 1fr 1fr; gap: .45em; margin-bottom: .75em; }
.on-modes button { font: inherit; border: .12em solid var(--line); background: var(--cream); border-radius: .7em; padding: .5em .4em; color: var(--ink); cursor: pointer; text-align: center; line-height: 1.15; }
.on-modes button b { display: block; font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: 1.1em; letter-spacing: .04em; }
.on-modes button small { display: block; font-size: .62em; color: var(--ink-soft); }
.on-modes button.on { border-color: var(--teal, #1FA79A); background: #E3F6F3; box-shadow: 0 0 0 .12em rgba(31,167,154,.25); }
.on-modes button:disabled { cursor: default; opacity: .75; }
.on-pane { display: flex; flex-direction: column; gap: .55em; }
.on-or { display: flex; align-items: center; gap: .5em; font-size: .66em; color: var(--ink-soft); margin: .15em 0; }
.on-or::before, .on-or::after { content: ""; flex: 1; height: .1em; background: var(--line); }
.on-join { display: flex; gap: .45em; }
.on-code-in { flex: 1; min-width: 0; font: inherit; font-family: "Bebas Neue", Impact, sans-serif; font-size: 1.35em; letter-spacing: .28em; text-align: center; text-transform: uppercase; padding: .25em .3em; border-radius: .45em; border: .1em solid var(--line); background: var(--cream); color: var(--ink); }
.on-code-in:focus { outline: none; border-color: var(--teal, #1FA79A); }
.on-codebox { text-align: center; background: #10202A; color: #fff; border-radius: .8em; padding: .45em .5em .35em; }
.on-codebox small { display: block; font-size: .6em; letter-spacing: .2em; opacity: .7; }
.on-codebox b { display: block; font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: 2.6em; letter-spacing: .22em; line-height: 1; padding-left: .22em; user-select: all; -webkit-user-select: all; }
.on-share { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .4em; }
.on-share .btn { padding-left: .3em; padding-right: .3em; font-size: .78em; }
.on-share .btn svg { display: none; }
.on-status { min-height: 1.2em; font-size: .74em; text-align: center; margin: .7em 0 .2em; color: var(--ink-soft); line-height: 1.35; }
.on-status.good { color: #137A6F; }
.on-status.bad { color: var(--orange-d, #C2410C); }
.on-spin { display: inline-block; width: .8em; height: .8em; border-radius: 50%; border: .15em solid currentColor; border-right-color: transparent; vertical-align: -.1em; margin-right: .3em; animation: onspin .8s linear infinite; }
@keyframes onspin { to { transform: rotate(360deg); } }
.on-foot { display: flex; gap: .45em; justify-content: center; flex-wrap: wrap; margin-top: .5em; }
.on-foot .btn { flex: 1; min-width: 6.5em; }
.bs-online { display: flex; align-items: center; gap: .5em; font-size: .72em; line-height: 1.3; padding: .5em .7em; border-radius: .7em; background: #E3F6F3; border: .1em solid rgba(31,167,154,.35); color: var(--ink); margin: .4em 0; }
.bs-online .on-bt { flex: 1; }
.bs-online .link { font-size: 1em; }
.on-dot { width: .6em; height: .6em; border-radius: 50%; background: #F2C230; flex: none; }
.on-dot.live { background: #22C55E; box-shadow: 0 0 0 .2em rgba(34,197,94,.25); animation: onpulse 1.6s ease-in-out infinite; }
@keyframes onpulse { 50% { box-shadow: 0 0 0 .38em rgba(34,197,94,0); } }
.bs-go.waiting { filter: saturate(.4); opacity: .85; }

/* ======================================================================
   v8.1 fixes
   ====================================================================== */
/* results, pause and other overlay panels scroll instead of clipping on short screens */
.overlay .panel { max-height: calc(100% - 1em); overflow-y: auto; scrollbar-width: none; touch-action: pan-y; }
.overlay .panel::-webkit-scrollbar { display: none; }
#app.short .bres-board { max-height: 8.5em; }
#app.short .bres-score { font-size: 1.9em; margin: 0.05em 0 0.15em; }
#app.short .overlay .panel { padding: 0.8em 1em; }
/* radio: the speaker's name stays on one line */
.rd-bubble .rd-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#app.land .radio { width: min(23em, 40%); }
/* battle setup: section labels stay readable over white clouds */
.bs-label { text-shadow: 0 0.06em 0 rgba(30, 50, 60, 0.55), 0 0 0.5em rgba(20, 40, 50, 0.45); }
/* battle setup: CONTROLS and PLAY WITH A FRIEND live next to FIGHT so they are never below the fold */
.bs-foot .bs-row { margin: 0 0 0.5em; }
#app.land .bs-foot { display: flex; gap: 0.6em; align-items: stretch; }
#app.land .bs-foot .bs-row { display: contents; }
#app.land .bs-foot .bs-row .btn { flex: 0 0 9.5em; margin: 0; font-size: 0.95em; }
#app.land .bs-foot .bs-row [data-act=controls] { order: 0; }
#app.land .bs-foot .bs-go { order: 1; flex: 1; }
#app.land .bs-foot .bs-row [data-act=binvite] { order: 2; }
#app.land.short .bs-map { height: 3.3em; }
#app.land.short .bs-go { font-size: 1.35em; }
#app.land.short .bs-label { margin: 0.35em 0 0.25em; }
/* guest in a friend's room: the host's choices are shown, and can't be changed */
.bs-locked .bs-map, .bs-locked .js-size button, .bs-locked .js-diff button { pointer-events: none; }
.bs-locked .bs-map:not(.on), .bs-locked .js-size button:not(.on), .bs-locked .js-diff button:not(.on) { opacity: 0.45; }
.bs-lockmsg { display: none; font-size: 0.62em; color: #fff; margin: -0.2em 0 0.3em; text-shadow: 0 1px 2px rgba(30, 40, 50, 0.6); }
.bs-locked .bs-lockmsg { display: block; }
/* loading screen: on wide screens the title sits left and the planet right, instead of on top of each other */
#app.land #s-loading.screen:not(#s-hud):not(#s-battle):not(#s-intro) { left: max(1em, calc(30% - 15.5em)); }
.load-tip { text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75), 0 0 0.6em rgba(10, 18, 48, 0.8) !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="app">
    <canvas id="game" aria-label="Sky Strike game view"></canvas>
    <div id="ui"></div>
  </div>
</div>
