    border-radius: calc(var(--u) * 22); padding: calc(var(--u) * 26) calc(var(--u) * 26); box-shadow: 0 calc(var(--u)*8) 0 #c9932a, 0 calc(var(--u)*14) calc(var(--u)*30) rgba(0,0,0,.5);

  .panel::-webkit-scrollbar { display: none; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .logo { font-size: calc(var(--u) * 54); font-weight: 900; line-height: .95; letter-spacing: calc(var(--u) * 1); color: var(--ink); text-shadow: calc(var(--u)*3) calc(var(--u)*3) 0 var(--yellow); }
  .logo small { display: block; font-size: calc(var(--u) * 22); letter-spacing: calc(var(--u) * 4); color: var(--red); text-shadow: none; margin-top: calc(var(--u) * 6); }
  .bn { font-size: calc(var(--u) * 22); color: #b5462e; margin: calc(var(--u) * 4) 0; }
  h2 { font-size: calc(var(--u) * 34); font-weight: 900; margin-bottom: calc(var(--u) * 6); }
  h3 { font-size: calc(var(--u) * 20); font-weight: 900; margin: calc(var(--u) * 14) 0 calc(var(--u) * 6); text-transform: uppercase; letter-spacing: calc(var(--u) * 1); color: #7a4b00; }
  p { margin: calc(var(--u) * 6) 0; line-height: 1.35; }

    font-size: calc(var(--u) * 21); border: none; border-radius: calc(var(--u) * 14); cursor: pointer; color: var(--ink); background: var(--yellow);

  .paint button { font: inherit; font-weight: 900; font-size: calc(var(--u) * 22); width: calc(var(--u) * 40); height: calc(var(--u) * 40); border: none; border-radius: calc(var(--u) * 10); background: var(--yellow); cursor: pointer; }
  .swatch { display: inline-block; width: calc(var(--u) * 18); height: calc(var(--u) * 18); border-radius: calc(var(--u) * 4); vertical-align: middle; margin-right: calc(var(--u) * 6); border: calc(var(--u) * 2) solid var(--ink); }
  input.name { font: inherit; font-size: calc(var(--u) * 18); width: 100%; padding: calc(var(--u) * 10); border-radius: calc(var(--u) * 10); border: calc(var(--u) * 2) solid #c9932a; margin-top: calc(var(--u) * 8); text-align: center; }
  .tiny { font-size: calc(var(--u) * 13); opacity: .65; margin-top: calc(var(--u) * 10); }
  .vs { display: flex; justify-content: space-around; align-items: center; font-weight: 900; font-size: calc(var(--u) * 28); margin: calc(var(--u) * 10) 0; }
  .p1 { color: #d6284a; } .p2 { color: #1188c4; }

<body>

<script>
/* =====================================================================
   PUJO NIGHT RUSH — Save the Last Yellow Taxi
   Single-file HTML5 Canvas game. No build step, no libraries, no sign-in.

   Engine patterns ported from our earlier games:
     - Fixed-step-clamped game loop, scrolling spawner, particles,
       screen shake, Web Audio SFX, LocalStorage save   (Sky Strike)
     - Single-file structure + "Storybook Flat" art style + chapter flow (Sporulation)
     - Wave/intensity ramp per level, boss behaviour states (Xenos Breach / Alien Purge)
   See CONTINUE.md for the code map.
   ===================================================================== */
'use strict';
(() => {

// ---------------------------------------------------------------- constants
const W = 600, H = 900, HUD_H = 64;
const ROAD_L = 95, ROAD_R = 505, LANE_W = (ROAD_R - ROAD_L) / 4;
const laneX = i => ROAD_L + LANE_W * (i + 0.5);
const CURB_X = [74, 526];
const EDGE_LANE = [0, 3];
const TRAM_LANE = 1;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------------------------------------------------------------- content
const NIGHTS = [
  { name: 'Panchami', bn: 'পঞ্চমী', rent: 200, scroll: 250, traffic: 1.8, bus: 12, rick: 6, tram: 13, cow: 9, pot: 6, crowd: 0, zip: 10, pass: 2.5,
    tip: 'Pick up people waving at the curb. Drive into YOUR glowing pandal gate to drop them.' },
  { name: 'Saptami', bn: 'সপ্তমী', rent: 350, scroll: 280, traffic: 1.5, bus: 10, rick: 5.5, tram: 12, cow: 8, pot: 5, crowd: 14, zip: 7, pass: 2.4,
    tip: 'ZipCabs overtake you to snatch fares. Honk to shove them out of the way!' },
  { name: 'Ashtami', bn: 'অষ্টমী', rent: 500, scroll: 305, traffic: 1.35, bus: 9, rick: 5, tram: 11, cow: 7, pot: 4.5, crowd: 11, zip: 6, pass: 2.3,
    tip: 'FRAGILE fares (idols, cakes) pay 2.5×. One crash and you lose it all.' },
  { name: 'Navami', bn: 'নবমী', rent: 600, scroll: 330, traffic: 1.2, bus: 8, rick: 4.5, tram: 10, cow: 6.5, pot: 4, crowd: 9, zip: 5, pass: 2.2,
    tip: 'Pandal crowds slow you down and annoy passengers. Pick your lane.' },
  { name: 'Dashami', bn: 'দশমী', rent: 750, scroll: 350, traffic: 1.2, bus: 8, rick: 4.5, tram: 10, cow: 6, pot: 4, crowd: 9, zip: 6, pass: 2.1, boss: true,
    tip: 'The ZipCab KING is hunting you. Ram him from the side 3 times to chase him off!' },
];
const SHOWDOWN = { name: 'Showdown', bn: 'লড়াই', scroll: 290, traffic: 1.6, bus: 10, rick: 6, tram: 12, cow: 8, pot: 5, crowd: 12, zip: 7, pass: 1.7, len: 60 };
const NIGHT_LEN = 75;

const CHARS = [
  { id: 'thakuma', name: 'Thakuma', emoji: '👵', type: 'granny', bubble: 'Taxi! Aste chalabe!', color: '#c0392b', story: 'Going to see the Bagbazar idol. I have not missed one since 1961.', min: 0 },
  { id: 'student', name: 'College Street Student', emoji: '🎓', type: 'normal', bubble: 'Taxi!', color: '#2e86de', story: 'If I reach the Coffee House late, the adda starts without me. Again.', min: 0 },
  { id: 'phuchka', name: 'Phuchka-wala', emoji: '🥟', type: 'normal', bubble: 'Dada, cholo!', color: '#e67e22', story: 'Two thousand phuchkas tonight. My feet have officially retired.', min: 0 },
  { id: 'dhaaki', name: 'The Dhaaki', emoji: '🥁', type: 'normal', bubble: 'Taxi! Taxi!', color: '#8e44ad', story: 'My dhak is the heartbeat of this para. Faster, dada, the aarti waits for no one.', min: 0 },
  { id: 'romeo', name: 'Nervous Boy', emoji: '🌹', type: 'rush', bubble: 'Quick! Please!', color: '#e84393', story: 'She said Maddox Square at nine. It is 8:58. Drive like the wind!', min: 0 },
  { id: 'nurse', name: 'Night-shift Nurse', emoji: '🩺', type: 'normal', bubble: 'Taxi!', color: '#16a085', story: 'Twelve hours on my feet. Just get me home before the Sandhi Puja.', min: 0 },
  { id: 'tourist', name: 'Tourist from Delhi', emoji: '🧳', type: 'normal', bubble: 'Bhaiya, taxi?', color: '#f39c12', story: 'Which pandal is the best one? ...All of them? Then take me to all of them.', min: 0 },
  { id: 'howrah', name: 'Howrah Uncle', emoji: '🚆', type: 'howrah', bubble: 'Dada, Howrah jaben?', color: '#6d4c41', story: 'Last train to Bardhaman. The whole family is waiting with luchi and alur dom.', min: 1 },
  { id: 'biryani', name: 'Biryani Hunter', emoji: '🍛', type: 'normal', bubble: 'Taxi!', color: '#d35400', story: 'Is there a potato in it? There MUST be a potato in it.', min: 1 },
  { id: 'tramdriver', name: 'Retired Tram Driver', emoji: '🚋', type: 'normal', bubble: 'Ei taxi!', color: '#34495e', story: 'I drove the old tram for thirty years. You drive well, young one.', min: 1 },
  { id: 'artisan', name: 'Kumartuli Artisan', emoji: '🎨', type: 'fragile', bubble: 'Gently, dada!', color: '#a1887f', cargo: 'IDOL', story: 'Ma’s face took me forty nights. One bump and it all cracks. Please.', min: 2 },
  { id: 'cake', name: 'Bride’s Brother', emoji: '🎂', type: 'fragile', bubble: 'Careful! Cake!', color: '#ff7675', cargo: 'CAKE', story: 'This cake survived two floods and an uncle. Do not be the third disaster.', min: 2 },
  { id: 'captain', name: 'Para Football Captain', emoji: '⚽', type: 'normal', bubble: 'Taxi!', color: '#27ae60', story: 'Mohun Bagan or East Bengal? Choose carefully, dada. Your tip depends on it.', min: 2 },
  { id: 'mother', name: 'Mother & Daughter', emoji: '🦁', type: 'normal', bubble: 'Taxi please!', color: '#fd79a8', story: 'She wants to see the lion at the pandal. For the fifth time tonight.', min: 3 },
  { id: 'harida', name: 'Hari-da', emoji: '🚕', type: 'normal', bubble: 'Oi, bhai!', color: '#f1c40f', story: 'They scrapped my Ambassador last year. Keep yours running, bhai. For all of us.', min: 4 },
];
const TYPE = {
  normal: { mult: 1, ride: [5, 8], extra: 12, label: '' },
  granny: { mult: 1.25, ride: [5, 8], extra: 13, label: 'NO BUMPS!' },
  rush:   { mult: 1.5, ride: [4, 6], extra: 8, label: 'RUSH!' },
  howrah: { mult: 2, ride: [11, 13], extra: 13, label: 'HOWRAH ×2' },
  fragile:{ mult: 2.5, ride: [6, 8], extra: 13, label: 'FRAGILE' },
};
const PAINTS = [
  { name: 'Classic Yellow', body: '#f7c531', dark: '#c99a14', stripe: null, rank: 0 },
  { name: 'No-Refusal Stripe', body: '#f7c531', dark: '#c99a14', stripe: '#2b5fd9', rank: 1 },
  { name: 'Pujo Red', body: '#e8442e', dark: '#a32b1b', stripe: '#f7c531', rank: 2 },
  { name: 'Alpana White', body: '#f4efe4', dark: '#c8bfae', stripe: '#d63031', rank: 3 },
  { name: 'Gold Ambassador', body: '#e3b341', dark: '#8a6400', stripe: '#2d1b00', rank: 4 },
];
const RANKS = [
  { xp: 0, name: 'New Driver' }, { xp: 120, name: 'Para Regular' }, { xp: 350, name: 'Pujo Pro' },
  { xp: 750, name: 'Howrah Hero' }, { xp: 1400, name: 'Legend of the Meter' },
];
const UPGRADES = {
  engine: { name: 'Engine', icon: '⚙️', desc: 'faster steering', cost: [150, 300], max: 2 },
  bumper: { name: 'Bumper', icon: '🛡️', desc: 'less damage, harder rams', cost: [150, 300], max: 2 },
  horn:   { name: 'Horn', icon: '📯', desc: 'shorter cooldown', cost: [100, 200], max: 2 },
};
const P_COLORS = ['#ff4d6d', '#3ec7ff'];

// ---------------------------------------------------------------- save (LocalStorage, no sign-in)
const SAVE_KEY = 'pujoNightRush_v1';
let S = { xp: 0, paint: 0, journal: {}, best: 0, plays: 0, muted: false };
try { const raw = localStorage.getItem(SAVE_KEY); if (raw) S = Object.assign(S, JSON.parse(raw) || {}); } catch (e) { /* storage blocked: play without saving */ }
if (!S.journal || typeof S.journal !== 'object') S.journal = {};
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }
function rankIndex(xp) { let r = 0; RANKS.forEach((k, i) => { if (xp >= k.xp) r = i; }); return r; }

// challenge link (?beat=1234&from=Name)
const CHALLENGE = (() => {
  try {
    const q = new URLSearchParams(location.search);
    const beat = parseInt(q.get('beat'), 10);
    if (!isFinite(beat) || beat <= 0) return null;
    const from = (q.get('from') || 'A friend').replace(/[^\p{L}\p{N} ._-]/gu, '').slice(0, 20) || 'A friend';
    return { beat: Math.min(beat, 999999), from };
  } catch (e) { return null; }
})();

// ---------------------------------------------------------------- canvas
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const wrap = document.getElementById('wrap');
const overlay = document.getElementById('overlay');
let scale = 1;
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / W, vh / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
  wrap.style.width = cw + 'px'; wrap.style.height = ch + 'px';
  wrap.style.setProperty('--u', scale + 'px');
  cvs.width = Math.max(1, Math.floor(cw * dpr)); cvs.height = Math.max(1, Math.floor(ch * dpr));
  cvs.style.width = cw + 'px'; cvs.style.height = ch + 'px';
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- audio (Web Audio, all procedural)
const AU = { ctx: null, master: null, noise: null, next: 0, step: 0, timer: null };
// Optional recorded voice lines. Drop mp3s in /audio and list them here, e.g. jaben: 'audio/jaben.mp3'
const VOICE_FILES = {};
const VOICE = {};
Object.keys(VOICE_FILES).forEach(k => { try { const a = new Audio(VOICE_FILES[k]); a.preload = 'auto'; VOICE[k] = a; } catch (e) { /* ignore */ } });
function voice(k) { const a = VOICE[k]; if (!a || S.muted) return; try { a.currentTime = 0; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ } }

function audioInit() {
  try {
    if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    AU.ctx = new AC();
    AU.master = AU.ctx.createGain();
    AU.master.gain.value = S.muted ? 0 : 0.6;
    AU.master.connect(AU.ctx.destination);
    const len = AU.ctx.sampleRate;
    const buf = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    AU.noise = buf;
    AU.timer = setInterval(scheduleDhak, 25);
  } catch (e) { AU.ctx = null; }
}
function setMuted(m) { S.muted = m; save(); if (AU.master) AU.master.gain.value = m ? 0 : 0.6; }
function tone(freq, dur, type = 'sine', vol = 0.2, at = 0, f2 = 0) {
  if (!AU.ctx) return;
  const t0 = at || AU.ctx.currentTime;
  const o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  o.connect(g); g.connect(AU.master); o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(dur, vol = 0.2, at = 0, freq = 1200, ftype = 'lowpass') {
  if (!AU.ctx || !AU.noise) return;
  const t0 = at || AU.ctx.currentTime;
  const s = AU.ctx.createBufferSource(); s.buffer = AU.noise;
  const f = AU.ctx.createBiquadFilter(); f.type = ftype; f.frequency.value = freq;
  const g = AU.ctx.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  s.connect(f); f.connect(g); g.connect(AU.master); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.03);
}
const SFX = {
  horn() { tone(392, 0.15, 'sawtooth', 0.09); tone(494, 0.15, 'sawtooth', 0.07);
    if (AU.ctx) { const t = AU.ctx.currentTime + 0.19; tone(392, 0.2, 'sawtooth', 0.09, t); tone(494, 0.2, 'sawtooth', 0.07, t); } },
  crash() { noise(0.35, 0.35, 0, 900); tone(90, 0.25, 'sine', 0.3, 0, 40); },
  bump() { tone(120, 0.12, 'sine', 0.25, 0, 60); noise(0.08, 0.15, 0, 600); },
  coin() { if (!AU.ctx) return; const t = AU.ctx.currentTime; tone(880, 0.08, 'square', 0.06, t); tone(1320, 0.18, 'square', 0.06, t + 0.07); },
  pickup() { if (!AU.ctx) return; const t = AU.ctx.currentTime; [523, 659, 784].forEach((f, i) => tone(f, 0.1, 'triangle', 0.12, t + i * 0.06)); },
  steal() { if (!AU.ctx) return; const t = AU.ctx.currentTime; tone(700, 0.12, 'square', 0.08, t, 350); tone(300, 0.25, 'square', 0.07, t + 0.1, 150); },
  lost() { tone(330, 0.4, 'triangle', 0.15, 0, 140); },
  bell() { if (!AU.ctx) return; const t = AU.ctx.currentTime; tone(1760, 0.25, 'triangle', 0.08, t); tone(1760, 0.3, 'triangle', 0.08, t + 0.18); },
  moo() { tone(150, 0.6, 'sawtooth', 0.06, 0, 105); },
  strike() { tone(110, 0.6, 'square', 0.12, 0, 70); },
  win() { if (!AU.ctx) return; const t = AU.ctx.currentTime; [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.14, t + i * 0.12)); },
  click() { tone(660, 0.05, 'square', 0.05); },
};
// Dhak drum loop. Tempo climbs as dawn approaches: you feel the deadline.
const DHAK = [2, 0, 1, 0, 1, 0, 2, 0, 2, 0, 1, 1, 0, 1, 2, 0];
function drum(at, f, vol) { tone(f, 0.28, 'sine', vol, at, f * 0.55); noise(0.05, vol * 0.35, at, 1100, 'bandpass'); }
function kashor(at, vol) { tone(2400, 0.05, 'square', vol * 0.25, at); tone(3150, 0.07, 'triangle', vol * 0.3, at); }
function scheduleDhak() {
  if (!AU.ctx || S.muted) return;
  const playing = G.state === 'play', menu = G.state === 'menu';
  if (!playing && !menu) { AU.next = 0; return; }

const pointers = new Map();

const PAUSE_BTN = { x: W - 52, y: HUD_H + 10, w: 42, h: 42 };

function touchButtons() {

      { id: 0, act: 'l', x: 12, y, w: 74, h: s, label: '◀' }, { id: 0, act: 'r', x: 92, y, w: 74, h: s, label: '▶' }, { id: 0, act: 'h', x: 172, y, w: 74, h: s, label: 'HONK' },
      { id: 1, act: 'l', x: W - 246, y, w: 74, h: s, label: '◀' }, { id: 1, act: 'r', x: W - 166, y, w: 74, h: s, label: '▶' }, { id: 1, act: 'h', x: W - 86, y, w: 74, h: s, label: 'HONK' },
    ];
  }
  return [
    { id: 0, act: 'l', x: 14, y, w: s, h: s, label: '◀' }, { id: 0, act: 'r', x: 14 + s + 10, y, w: s, h: s, label: '▶' },
    { id: 0, act: 'u', x: W - 2 * s - 24, y, w: s, h: s, label: 'BOOST' }, { id: 0, act: 'h', x: W - s - 14, y, w: s, h: s, label: 'HONK' },

function touchInput(idx) {
  const out = { ix: 0, iy: 0, horn: false };
  if (!touchMode || pointers.size === 0) return out;
  const btns = touchButtons();
  for (const p of pointers.values()) {
    for (const b of btns) {
      if (b.id !== idx) continue;
      if (inRect(p, { x: b.x - 6, y: b.y - 10, w: b.w + 12, h: b.h + 20 })) {
        if (b.act === 'l') out.ix -= 1; else if (b.act === 'r') out.ix += 1; else if (b.act === 'u') out.iy -= 1; else if (b.act === 'h') out.horn = true;

function readInput(t) {
  let ix = 0, iy = 0, horn = false;
  const sets = G.mode === '2p' ? [t.idx === 0 ? P1KEYS : P2KEYS] : [P1KEYS, P2KEYS];
  for (const k of sets) {
    if (k.l.some(c => keys[c])) ix -= 1;
    if (k.r.some(c => keys[c])) ix += 1;
    if (k.u.some(c => keys[c])) iy -= 1;

// ---------------------------------------------------------------- update
function updateTaxi(t, dt) {
  t.hornCd = Math.max(0, t.hornCd - dt); t.inv = Math.max(0, t.inv - dt); t.stealCd = Math.max(0, t.stealCd - dt);
  t.stun = Math.max(0, t.stun - dt); t.hornFx = Math.max(0, t.hornFx - dt);
  let inp = readInput(t);
  if (t.stall > 0) {
    t.stall -= dt; inp = { ix: 0, iy: 0, horn: false };
    if (Math.random() < 0.6) smoke(t.x + rand(-8, 8), t.y - 20);
    if (t.stall <= 0) { t.hp = Math.max(t.hp, 40); addFloat(t.x, t.y - 40, 'Back on the road!', '#7bed9f', 16); }
  }
  if (t.stun > 0) { inp.ix *= 0.25; inp.iy *= 0.25; }
  const spd = (0.78 + 0.22 * t.hp / 100) * (G.mode === '1p' ? 1 + 0.12 * G.up.engine : 1.06);
  t.vx += inp.ix * 1900 * spd * dt;
  t.vx *= Math.exp(-6.5 * dt);
  t.vx = clamp(t.vx, -360 * spd, 360 * spd);
  if (inp.iy !== 0) t.vy += inp.iy * 1400 * spd * dt;
  else t.vy += (t.homeY - t.y) * 4 * dt;
  if (t.inCrowd) { t.vy += 700 * dt; t.vx *= Math.exp(-4 * dt); }
  if (t.stall > 0) t.vy = 110;
  t.vy *= Math.exp(-5 * dt);
  t.vy = clamp(t.vy, -400, 400);
  t.x += t.vx * dt; t.y += t.vy * dt;
  const minX = ROAD_L + 19, maxX = ROAD_R - 19;
  if (t.x < minX) { t.x = minX; t.vx = Math.abs(t.vx) * 0.3; }
  if (t.x > maxX) { t.x = maxX; t.vx = -Math.abs(t.vx) * 0.3; }
  t.y = clamp(t.y, HUD_H + 110, H - 70);
  t.tilt = lerp(t.tilt, t.vx / 360 * 0.28, Math.min(1, dt * 10));
  if (inp.horn && !t.hornHeld && t.hornCd <= 0 && t.stall <= 0) horn(t);
  t.hornHeld = inp.horn;

  const p = t.pass;
  if (p) {
    p.meter -= dt;
    p.mood = Math.max(0, p.mood - dt * (p.type === 'granny' ? 2 : 1.3) - (t.inCrowd ? dt * 6 : 0));
    if (!p.zone) { p.ride -= dt; if (p.ride <= 0) spawnZone(t); }
    if (p.meter <= 0) loseFare(t, 'Meter ran out! Passenger left!');
  }
}

function updateObjs(dt) {
  const sc = G.cfg.scroll;
  for (const o of G.objs) { o.t += dt; o.dy = sc * (1 - o.own); }
  // queueing: a faster object never drives through a slower one in its lane
  for (const a of G.objs) {
    if (a.flat) continue;
    for (const b of G.objs) {
      if (a === b || b.flat || Math.abs(a.x - b.x) > 42) continue;
      const gap = 14;
      if (a.dy > 0 && a.y < b.y && a.y + a.h / 2 + gap > b.y - b.h / 2 && a.dy > b.dy) a.dy = b.dy;
      if (a.kind === 'zip' && a.y > b.y && a.y - a.h / 2 - gap < b.y + b.h / 2 && a.dy < b.dy) a.dy = Math.min(b.dy, sc * 0.2);
    }
  }
  for (const o of G.objs) {
    if (o.kind === 'zip') updateZip(o, dt);
    else if (!o.flat) {
      if (o.kind === 'cow') { o.x += o.wander * dt; if (o.x < ROAD_L + 25 || o.x > ROAD_R - 25) o.wander *= -1; o.bubbleT = Math.max(0, o.bubbleT - dt); }
      else o.x += (laneX(o.lane) + (o.kind === 'rick' ? 0 : 0) - o.x) * 1.5 * dt;
      o.x += o.vx * dt; o.vx *= Math.exp(-4 * dt);
      if (o.bubbleT) o.bubbleT = Math.max(0, o.bubbleT - dt);
    }
    o.y += o.dy * dt;
  }
  G.objs = G.objs.filter(o => o.y < H + 260 && o.y > -320);
}
function updateZip(o, dt) {
  // hunt the nearest waiting passenger ahead
  if (!o.target || !G.waiting.includes(o.target) || o.target.y > o.y + 20) {
    o.target = null; let best = 1e9;
    for (const w of G.waiting) { if (w.state === 'ejected' && w.stateT > 0) continue; const d = o.y - w.y; if (d > 30 && d < 520 && d < best) { best = d; o.target = w; } }
  }
  let tx = laneX(o.lane);
  if (o.target) tx = laneX(EDGE_LANE[o.target.side]);
  // simple avoidance
  for (const b of G.objs) {
    if (b === o || b.flat) continue;
    if (b.y < o.y && o.y - b.y < 150 && Math.abs(b.x - o.x) < 46) { tx = o.x + (o.x < (ROAD_L + ROAD_R) / 2 ? 90 : -90); break; }
  }
  o.vx += (tx - o.x) * 5 * dt; o.vx *= Math.exp(-3 * dt); o.vx = clamp(o.vx, -300, 300);
  o.x = clamp(o.x + o.vx * dt, ROAD_L + 19, ROAD_R - 19);
  if (o.target && Math.abs(o.y - o.target.y) < 42 && Math.abs(o.x - laneX(EDGE_LANE[o.target.side])) < 50) {
    const w = o.target;
    G.waiting = G.waiting.filter(q => q !== w);
    addFloat(o.x, o.y - 40, 'ZipCab stole a fare!', '#55efc4', 17, 1.3);
    o.target = null; o.own += 0.25;
  }
}

function updateWaiting(dt) {
  const sc = G.cfg.scroll;
  for (const w of G.waiting) {
    w.y += sc * dt; w.ph += dt;
    if (w.state === 'ejected') { w.stateT -= dt; if (w.stateT <= 0) w.state = null; }
    if (w.state === 'ejected') continue;
    for (const t of G.taxis) {
      if (t.pass || t.stall > 0) continue;
      const nearLane = Math.abs(t.x - laneX(EDGE_LANE[w.side])) < 52;
      if (nearLane && Math.abs(t.y - w.y) < 55) { board(t, w); w.gone = true; break; }
    }
  }
  G.waiting = G.waiting.filter(w => !w.gone && w.y < H + 40);
}

function updateZones(dt) {
  const sc = G.cfg.scroll;
  for (const z of G.zones) {
    z.y += sc * dt; z.ph += dt;
    const t = z.owner;
    if (!t.pass || t.pass.zone !== z) { z.dead = true; continue; }
    if (Math.abs(t.x - laneX(EDGE_LANE[z.side])) < 60 && Math.abs(t.y - z.y) < z.h / 2 + 18 && t.stall <= 0) { deliver(t); z.dead = true; continue; }
    if (z.y - z.h / 2 > H) { z.dead = true; t.pass.zone = null; t.pass.ride = 2; addFloat(t.x, t.y - 50, 'Missed the pandal! Going around…', '#ffeaa7', 16, 1.4); }
  }
  G.zones = G.zones.filter(z => !z.dead);
}

const overlapR = (a, b, s = 0.82) => Math.abs(a.x - b.x) < (a.w + b.w) / 2 * s && Math.abs(a.y - b.y) < (a.h + b.h) / 2 * s;
function collisions(dt) {
  for (const t of G.taxis) {
    t.inCrowd = false;
    const tb = { x: t.x, y: t.y, w: 36, h: 62 };
    for (const o of G.objs) {
      if (!overlapR(tb, o)) continue;
      if (o.kind === 'crowd') { t.inCrowd = true; continue; }
      if (o.kind === 'pot') {
        if (!o.hit.has(t.idx) && t.stall <= 0) { o.hit.add(t.idx); hurt(t, 5, 'pot'); t.vy += 140; SFX.bump(); addFloat(t.x, t.y - 40, 'Pothole!', '#dfe6e9', 15, 0.8); burst(t.x, t.y + 20, 8, ['#74b9ff', '#a4b0be'], 120, 4, 0.5); }
        continue;
      }
      const dir = Math.sign(t.x - o.x) || (Math.random() < 0.5 ? -1 : 1);
      // separate
      const ox = (36 + o.w) / 2 * 0.82 - Math.abs(t.x - o.x);
      if (ox > 0) t.x += dir * Math.min(ox, 30);
      if (t.inv > 0 || t.stall > 0) continue;
      if (o.kind === 'zip') { o.vx -= dir * 260; o.target = null; }
      else o.vx -= dir * 70;
      hurt(t, o.dmg, o.kind);
      t.vx = dir * 280; t.vy = 230; t.stun = 0.3; t.inv = 0.75;
      burst((t.x + o.x) / 2, (t.y + o.y) / 2, 14, ['#ffeaa7', '#fdcb6e', '#ffffff'], 260, 4, 0.5);
      if (o.kind === 'cow') { SFX.moo(); o.bubbleT = 1.2; } else SFX.crash();
    }
  }
  // taxi vs taxi: RAM TO STEAL FARES
  if (G.taxis.length === 2) {
    const [a, b] = G.taxis;
    const A = { x: a.x, y: a.y, w: 36, h: 62 }, B = { x: b.x, y: b.y, w: 36, h: 62 };
    if (overlapR(A, B, 0.95)) {
      let nx = b.x - a.x, ny = (b.y - a.y) * 0.5; const d = Math.hypot(nx, ny) || 1; nx /= d; ny /= d;
      const pa = a.vx * nx + a.vy * ny, pb = -(b.vx * nx + b.vy * ny);
      const ox = 36 * 0.95 - Math.abs(b.x - a.x);
      if (ox > 0 && Math.abs(b.y - a.y) < 62 * 0.95) { const s = Math.sign(b.x - a.x) || 1; a.x -= s * ox / 2; b.x += s * ox / 2; }
      const rel = pa + pb;
      if (rel > 60) {
        const imp = rel * 0.9;
        a.vx -= nx * imp; a.vy -= ny * imp * 0.5; b.vx += nx * imp; b.vy += ny * imp * 0.5;
        SFX.bump(); burst((a.x + b.x) / 2, (a.y + b.y) / 2, 10, ['#fff', '#ffeaa7'], 220, 4, 0.4);
        G.shake = Math.min(12, G.shake + 5);
      }
      if (Math.max(pa, pb) > 150 && a.stealCd <= 0 && b.stealCd <= 0) {
        const att = pa >= pb ? a : b, vic = att === a ? b : a;
        a.stealCd = b.stealCd = 0.9;
        vic.stun = 0.45;
        if (vic.pass) {
          const ch = vic.pass.ch, keep = { mood: vic.pass.mood, meter: vic.pass.meter, ride: Math.max(1.5, vic.pass.ride) };
          if (vic.pass.type === 'fragile') { loseFare(vic, 'SMASHED! Cargo destroyed!', '#ff4757'); }
          else {
            clearZone(vic); vic.pass = null;
            if (!att.pass && att.stall <= 0) { board(att, Object.assign({ ch }, keep)); addFloat(att.x, att.y - 80, 'STOLEN! 😈', P_COLORS[att.idx], 28, 1.4); }
            else { dropToCurb(vic, ch, keep); addFloat(vic.x, vic.y - 70, 'KNOCKED OUT!', P_COLORS[att.idx], 24, 1.2); }
          }
          SFX.steal(); voice('stolen');
          G.shake = 14;
        }
        hurt(vic, 6, 'ram');
      }
    }
  }
}

function updateBoss(dt) {
  const c = G.cfg;
  if (!c.boss || G.mode !== '1p') return;
  if (!G.boss && !G.bossDone && G.t > 16 && G.t < G.len - 15) {
    G.boss = { x: (ROAD_L + ROAD_R) / 2, y: -120, vx: 0, vy: 0, w: 50, h: 84, hp: 3, phase: 'enter', timer: 1.5, hitCd: 0, leaving: false, flash: 0 };
    addFloat(W / 2, HUD_H + 120, 'THE ZIPCAB KING IS HERE!', '#55efc4', 26, 2.2);
    SFX.strike();
  }
  const b = G.boss;
  if (!b) return;
  const t = G.taxis[0];
  b.hitCd = Math.max(0, b.hitCd - dt); b.flash = Math.max(0, b.flash - dt);
  if (!b.leaving && G.t > G.len - 6) { b.leaving = true; addFloat(W / 2, HUD_H + 120, 'The KING speeds off…', '#55efc4', 20, 1.6); }
  if (b.leaving) { b.vy = -420; b.y += b.vy * dt; b.x += b.vx * dt; b.vx *= Math.exp(-3 * dt); if (b.y < -200) { G.boss = null; G.bossDone = true; } return; }
  b.timer -= dt;
  if (b.phase === 'enter') { b.y = lerp(b.y, t.y - 160, dt * 2); if (b.timer <= 0) { b.phase = 'stalk'; b.timer = 1.6; } }
  else if (b.phase === 'stalk') {
    const side = t.x < (ROAD_L + ROAD_R) / 2 ? 1 : -1;
    const tx = clamp(t.x + side * 115, ROAD_L + 26, ROAD_R - 26);
    b.vx += (tx - b.x) * 7 * dt; b.vx *= Math.exp(-4 * dt);
    b.y = lerp(b.y, t.y - 10, dt * 2.5);
    if (b.timer <= 0) { b.phase = 'charge'; b.timer = 0.75; b.vx = Math.sign(t.x - b.x) * 560; addFloat(b.x, b.y - 55, 'VROOM!', '#55efc4', 18, 0.6); }
  } else if (b.phase === 'charge') {
    b.y = lerp(b.y, t.y, dt * 2);
    if (b.timer <= 0) { b.phase = 'stalk'; b.timer = rand(1.3, 2.1); }
  } else if (b.phase === 'stunned') { b.vx *= Math.exp(-3 * dt); if (b.timer <= 0) { b.phase = 'stalk'; b.timer = 1.4; } }
  b.x = clamp(b.x + b.vx * dt, ROAD_L + 26, ROAD_R - 26);
  if (b.phase !== 'charge') b.vx *= Math.exp(-1.5 * dt);

  if (b.hitCd <= 0 && overlapR({ x: t.x, y: t.y, w: 36, h: 62 }, b, 0.9) && t.stall <= 0) {
    const dir = Math.sign(b.x - t.x) || 1;
    const taxiPush = t.vx * dir;
    const need = 190 - 35 * G.up.bumper;
    if (b.phase !== 'charge' && taxiPush > need) {
      b.hp--; b.hitCd = 0.9; b.flash = 0.4; b.phase = 'stunned'; b.timer = 1.1; b.vx = dir * 480; t.vx = -dir * 160;
      G.shake = 12; SFX.crash(); burst(b.x, b.y, 20, ['#55efc4', '#ffffff', '#ffd32a'], 300, 5, 0.6);
      if (b.hp <= 0) { b.leaving = true; t.wallet += 150; G.totalEarned += 150; t.nightEarned += 150; addFloat(W / 2, HUD_H + 130, 'KING DEFEATED! +₹150', '#ffd32a', 28, 2.2); SFX.win(); S.xp += 30; G.xpGained += 30; save(); }
      else addFloat(b.x, b.y - 60, 'RAMMED! ' + (3 - b.hp) + '/3', '#ffd32a', 22, 1.1);
    } else {
      b.hitCd = 1.0; t.inv = Math.max(t.inv, 0.6);
      t.vx = -dir * 440; t.stun = 0.4;
      hurt(t, 14, 'boss');
      if (t.pass) { const msg = t.pass.type === 'fragile' ? 'SMASHED! Cargo destroyed!' : 'KING SNATCHED YOUR FARE!'; loseFare(t, msg, '#55efc4'); SFX.steal(); }
      SFX.crash(); burst((b.x + t.x) / 2, b.y, 14, ['#fff', '#55efc4'], 240, 4, 0.5);
      if (b.phase === 'charge') { b.phase = 'stalk'; b.timer = 1.5; b.vx = dir * 200; }
    }
  }
}

function updateParticles(dt) {
  for (const p of G.parts) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.kind === 'petal') { p.vy += 260 * dt; p.vx *= Math.exp(-2 * dt); }
    else if (p.kind === 'smoke') { p.size += 14 * dt; }
    else if (p.kind === 'ring') { p.size += 360 * dt; }
    else { p.vx *= Math.exp(-3 * dt); p.vy *= Math.exp(-3 * dt); }
  }
  G.parts = G.parts.filter(p => p.life > 0);
  if (G.parts.length > 500) G.parts.splice(0, G.parts.length - 500);
  for (const f of G.floats) { f.life -= dt; f.y -= 40 * dt; }
  G.floats = G.floats.filter(f => f.life > 0);
  G.shake = Math.max(0, G.shake - dt * 30);
}

function update(dt) {
  G.bgY += G.cfg.scroll * dt;
  if (G.state !== 'play') { updateParticles(dt); return; }
  G.t += dt;
  runSpawners(dt);
  for (const t of G.taxis) updateTaxi(t, dt);
  updateObjs(dt);
  updateWaiting(dt);
  updateZones(dt);
  collisions(dt);
  updateBoss(dt);
  updateParticles(dt);
  if (G.t >= G.len) endNight();
}

// ---------------------------------------------------------------- night / round end
function endNight() {
  G.taxis.forEach(t => { if (t.pass) { clearZone(t); t.pass = null; } });
  if (G.mode === '2p') return endRound();
  const t = G.taxis[0];
  const rent = G.cfg.rent;
  const paid = t.wallet >= rent;
  const before = t.wallet;
  if (paid) { t.wallet -= rent; SFX.win(); voice('paid'); }
  else { G.strikes++; t.wallet = 0; SFX.strike(); }
  G.lastResult = { paid, rent, before, tonight: t.nightEarned || 0 };
  const last = G.night === NIGHTS.length - 1;
  if (G.strikes >= 3 || (last && !paid)) return endGame(false);
  if (last && paid) return endGame(true);
  G.state = 'dawn';
  showDawn();
}
function endRound() {
  const [a, b] = G.taxis;
  let w = -1;
  if (a.wallet > b.wallet) w = 0; else if (b.wallet > a.wallet) w = 1;
  if (w >= 0) G.wins[w]++;
  G.lastResult = { w, a: a.wallet, b: b.wallet };
  G.taxis.forEach(t => { S.xp += Math.round(t.deliveries * 2); });
  save();
  SFX.win();
  G.state = 'round';
  showRound();
}
function endGame(won) {
  G.state = 'end';
  const score = G.totalEarned;
  const newBest = score > S.best;
  if (newBest) S.best = score;
  save();
  showEnd(won, score, newBest);
}

// ---------------------------------------------------------------- drawing helpers
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function text(str, x, y, size, color, align = 'center', weight = '900', stroke = null) {
  ctx.font = `${weight} ${size}px "Trebuchet MS", "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function bubble(x, y, str, bg = '#fff', fg = '#1b1430', size = 13) {
  ctx.font = `800 ${size}px "Trebuchet MS", system-ui, sans-serif`;
  const w = ctx.measureText(str).width + 14, h = size + 10;
  let bx = clamp(x - w / 2, 4, W - w - 4);
  const by = y - h - 8;
  ctx.fillStyle = bg; rr(bx, by, w, h, 8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(clamp(x, bx + 8, bx + w - 8) - 5, by + h); ctx.lineTo(clamp(x, bx + 8, bx + w - 8) + 5, by + h); ctx.lineTo(clamp(x, bx + 8, bx + w - 8), by + h + 7); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(str, bx + 7, by + h / 2 + 1);
}

// ---------------------------------------------------------------- world drawing (Storybook Flat)
const BLOCK = 140;
const BUILD_COLS = ['#5b3a6b', '#7a4a3a', '#3f5d6b', '#6b5b3a', '#4b3a6b', '#6b3a4f', '#3a6b5b'];
function drawBackground() {
  const prog = G.state === 'play' ? clamp(G.t / G.len, 0, 1) : 0;
  // road
  ctx.fillStyle = '#2b2838'; ctx.fillRect(ROAD_L, 0, ROAD_R - ROAD_L, H);
  // sidewalks
  ctx.fillStyle = '#8d7b68'; ctx.fillRect(56, 0, ROAD_L - 56, H); ctx.fillRect(ROAD_R, 0, W - 56 - ROAD_R, H);
  ctx.fillStyle = '#a8957f'; ctx.fillRect(ROAD_L - 6, 0, 6, H); ctx.fillRect(ROAD_R, 0, 6, H);
  const off = G.bgY % 40;
  ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = 2;
  for (let y = -40 + off; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(56, y); ctx.lineTo(ROAD_L - 6, y); ctx.moveTo(ROAD_R + 6, y); ctx.lineTo(W - 56, y); ctx.stroke(); }

  const tx = laneX(TRAM_LANE);

  ctx.strokeStyle = '#9aa0a6'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(tx - 14, 0); ctx.lineTo(tx - 14, H); ctx.moveTo(tx + 14, 0); ctx.lineTo(tx + 14, H); ctx.stroke();

  // buildings & pandals
  for (const side of [0, 1]) {
    const x0 = side === 0 ? 0 : W - 56;
    const base = Math.floor(G.bgY / BLOCK);
    const o2 = G.bgY % BLOCK;
    for (let i = -1; i <= Math.ceil(H / BLOCK); i++) {
      const id = base - i, y = i * BLOCK + o2;

        ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(side === 0 ? x0 + 48 : x0, y, 8, BLOCK - 4);
        for (let wy = 0; wy < 4; wy++) for (let wx = 0; wx < 2; wx++) {

          ctx.fillRect(x0 + 10 + wx * 20, y + 14 + wy * 30, 12, 16);
        }
      }
    }
  }
  // overhead Pujo light strings
  const sp = 420, lo = G.bgY % sp;
  for (let y = -sp + lo; y < H + 40; y += sp) {
    const n = 24;
    for (let i = 0; i <= n; i++) {
      const u = i / n, x = 50 + u * (W - 100), yy = y + Math.sin(u * Math.PI) * 34;
      const c = ['#ff4757', '#ffd32a', '#2ed573', '#1e90ff', '#ff6b81'][i % 5];
      const tw = 0.55 + 0.45 * Math.sin(performance.now() / 180 + i * 1.7);
      ctx.globalAlpha = tw; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, yy, 3.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  return prog;
}
function drawPandalFacade(x0, y, side, id) {

  ctx.fillStyle = '#3a1f4b'; ctx.fillRect(x0, y, 56, BLOCK - 4);
  ctx.fillStyle = c; ctx.fillRect(x0 + 6, y + 24, 44, BLOCK - 34);

  ctx.fillStyle = '#2d1b00'; rr(x0 + 16, y + 60, 24, 70, 10); ctx.fill();
  ctx.fillStyle = '#ffd32a';
  for (let i = 0; i < 7; i++) { const a = performance.now() / 300 + i; ctx.globalAlpha = 0.6 + 0.4 * Math.sin(a); ctx.beginPath(); ctx.arc(x0 + 8 + i * 6.7, y + 30, 2.2, 0, 7); ctx.fill(); }

function drawCarShape(x, y, w, h, body, dark, opts = {}) {
  ctx.save(); ctx.translate(x, y); if (opts.rot) ctx.rotate(opts.rot);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(-w / 2 + 3, -h / 2 + 5, w, h, 9); ctx.fill();

  const k = cvs.width / W;
  ctx.setTransform(k, 0, 0, cvs.height / H, 0, 0);
  ctx.save();
  if (G.shake > 0) ctx.translate(rand(-G.shake, G.shake) * 0.5, rand(-G.shake, G.shake) * 0.5);
  const prog = drawBackground();
  const inGame = G.state !== 'menu';
  if (inGame) {
    for (const z of G.zones) drawZone(z);
    for (const o of G.objs) if (o.flat) drawObj(o);
    for (const w of G.waiting) drawWaiting(w);
    for (const o of G.objs) if (!o.flat && o.kind !== 'zip') drawObj(o);
    for (const o of G.objs) if (o.kind === 'zip') drawObj(o);

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0;
  dt = Math.min(dt, 0.05);
  try { update(dt); draw(); }
  catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}

});
const controlsHTML = () => G.mode === '2p'
  ? `<div class="keys"><div><b class="p1">PLAYER 1</b><br><kbd>A</kbd> <kbd>D</kbd> steer · <kbd>W</kbd> <kbd>S</kbd> speed<br><kbd>SPACE</kbd> honk</div><div><b class="p2">PLAYER 2</b><br><kbd>◀</kbd> <kbd>▶</kbd> steer · <kbd>▲</kbd> <kbd>▼</kbd> speed<br><kbd>ENTER</kbd> honk</div></div><p class="muted">On a phone: left buttons for P1, right buttons for P2.</p>`
  : `<div class="keys"><div><b>KEYBOARD</b><br><kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd> steer<br><kbd>↑</kbd> speed up · <kbd>SPACE</kbd> honk</div><div><b>PHONE</b><br>◀ ▶ steer<br>BOOST · HONK buttons</div></div>`;

function showMenu() {
  G.state = 'menu';
  const r = rankIndex(S.xp), next = RANKS[r + 1];
  const paintIdx = Math.min(S.paint, r);
  const pt = PAINTS[paintIdx];
  const cards = Object.keys(S.journal).length;
  showOverlay(`
    <div class="logo">PUJO NIGHT<br>RUSH<small>SAVE THE LAST YELLOW TAXI</small></div>
    <p style="margin-top:calc(var(--u)*12)">It's Durga Puja in Kolkata. App cabs are taking over.<br><b>Earn the malik's rent by dawn, or your Ambassador gets scrapped.</b></p>
    ${CHALLENGE ? `<div class="banner">🏁 ${esc(CHALLENGE.from)} earned ₹${CHALLENGE.beat}. Can you beat it?</div>` : ''}
    <button class="btn" data-a="play1" data-primary>▶ STORY MODE · 1 PLAYER</button>
    <button class="btn red" data-a="play2">⚔ SHOWDOWN · 2 PLAYERS</button>
    <div class="row"><button class="btn ghost" data-a="journal">📖 Stories ${cards}/${CHARS.length}</button><button class="btn ghost" data-a="how">❓ How to play</button></div>
    <div class="paint"><button data-a="paintPrev" aria-label="previous paint">‹</button><span><span class="swatch" style="background:${pt.body}"></span>${pt.name}</span><button data-a="paintNext" aria-label="next paint">›</button></div>
    <p class="muted" style="margin-top:calc(var(--u)*8)">🏅 ${RANKS[r].name} · ${S.xp} XP${next ? ' · next rank at ' + next.xp : ''}${S.best ? ' · best run ₹' + S.best : ''}</p>
    <div class="row"><button class="btn ghost" data-a="mute">${S.muted ? '🔇 Sound off' : '🔊 Sound on'}</button></div>
    <p class="tiny">No sign-up. Progress saves in this browser.</p>`);
}
function showHow() {
  showOverlay(`<h2>How to play</h2>
    <p>🙋 <b>Pick up</b> people waving at the curb: drive in the edge lane next to them.</p>
    <p>🏮 <b>Drop them</b> by driving into <b>your glowing pandal gate</b>. Follow the ◀ DROP / DROP ▶ arrow.</p>
    <p>⏱ Watch the <b>meter bar</b>. Smooth driving = happy passengers = tips.</p>
    <p>🚋 Dodge trams, buses, rickshaws, cows and potholes. Crashes hurt your taxi.</p>
    <p>📯 <b>Honk</b> to shove ZipCabs, cows and rivals away.</p>
    <p>😈 <b>Showdown:</b> ram your rival from the side to <b>steal their passenger!</b></p>
    <p>🌅 <b>Story:</b> pay the malik's rent by dawn. 3 strikes and the taxi is scrapped.</p>
    ${controlsHTML()}
    <button class="btn" data-a="menu" data-primary>Got it</button>`);
}
function showJournal() {
  const html = CHARS.map(c => S.journal[c.id]
    ? `<div class="card"><span class="em">${c.emoji}</span><b>${esc(c.name)}</b>“${esc(c.story)}”</div>`
    : `<div class="card locked"><span class="em">❔</span><b>???</b>Deliver this passenger to unlock their story.</div>`).join('');
  showOverlay(`<h2>📖 Story Cards</h2><p class="muted">Every passenger has a story. Collect all ${CHARS.length}.</p><div class="cards">${html}</div><button class="btn" data-a="menu" data-primary>Back</button>`);
}
function showIntro() {
  G.state = 'intro';
  if (G.mode === '1p') {
    const n = NIGHTS[G.night];
    showOverlay(`<p class="muted">NIGHT ${G.night + 1} OF 5</p><h2>${n.name}</h2><div class="bn">${n.bn}</div>
      <div class="banner">The malik wants <b>₹${n.rent}</b> by dawn</div>
      <p><b>${esc(n.tip)}</b></p>
      ${G.night === 0 ? '<p class="muted">You have 75 seconds. Miss rent = a strike. 3 strikes = scrapped.</p>' : ''}
      ${G.night === 0 ? controlsHTML() : ''}
      <button class="btn" data-a="go" data-primary>START THE NIGHT ▶</button>`);
  } else {
    showOverlay(`<p class="muted">FIRST TO 2 ROUNDS WINS</p><h2>Round ${G.round}</h2>
      <div class="vs"><span class="p1">P1 ${G.wins[0]}</span><span>–</span><span class="p2">${G.wins[1]} P2</span></div>
      <p><b>Most money in 60 seconds wins the round.</b><br>Ram your rival from the side to <b>steal their passenger</b>. Honk to shove them.</p>
      ${controlsHTML()}
      <button class="btn red" data-a="go" data-primary>FIGHT! ▶</button>`);
  }
}
function showDawn() {
  const t = G.taxis[0], r = G.lastResult, next = NIGHTS[G.night + 1];
  const stories = G.nightStories.slice(0, 4).map(c => `<div class="card"><span class="em">${c.emoji}</span><b>${esc(c.name)}</b>“${esc(c.story)}”</div>`).join('');
  const repairCost = Math.ceil((100 - t.hp) * 1.5 / 5) * 5;
  const shop = Object.keys(UPGRADES).map(k => {
    const u = UPGRADES[k], lv = G.up[k];
    if (lv >= u.max) return `<button class="btn ghost" disabled>${u.icon} ${u.name} MAX</button>`;
    const cost = u.cost[lv];
    return `<button class="btn ghost" data-a="buy" data-k="${k}" ${t.wallet < cost ? 'disabled' : ''}>${u.icon} ${u.name} Lv${lv + 1}<br><span class="muted">${u.desc} · ₹${cost}</span></button>`;
  }).join('');
  showOverlay(`<p class="muted">🌅 DAWN AFTER ${G.cfg.name.toUpperCase()}</p>
    <p>Tonight's fares: <b>₹${r.tonight}</b> · Wallet: <b>₹${r.before}</b> · Rent: <b>₹${r.rent}</b></p>
    <div class="big ${r.paid ? 'ok' : 'bad'}">${r.paid ? 'RENT PAID ✅' : 'STRIKE ' + G.strikes + '/3 ❌'}</div>
    <p class="muted">${r.paid ? 'The malik counts the notes twice and grunts. The taxi lives another night.' : 'The malik shakes his head. "One more miss and she goes to the scrapyard."'}</p>
    ${stories ? `<h3>Passengers tonight</h3><div class="cards">${stories}</div>` : ''}
    <h3>Garage · savings ₹${t.wallet}</h3>
    <div class="shop">
      <button class="btn ghost" data-a="repair" ${t.hp >= 100 || t.wallet < repairCost ? 'disabled' : ''}>🔧 Repair ${Math.round(t.hp)}%→100%<br><span class="muted">${t.hp >= 100 ? 'no dents!' : '₹' + repairCost}</span></button>
      ${shop}
    </div>
    <p class="muted">Dents carry over. Savings count toward tomorrow's rent.</p>
    <button class="btn" data-a="nextNight" data-primary>${next.name.toUpperCase()} NIGHT ▶ (rent ₹${next.rent})</button>`);
}
function showRound() {
  const r = G.lastResult;
  const champ = G.wins[0] >= 2 ? 0 : G.wins[1] >= 2 ? 1 : -1;
  const msg = r.w < 0 ? 'DRAW!' : `<span class="${r.w === 0 ? 'p1' : 'p2'}">PLAYER ${r.w + 1} WINS THE ROUND</span>`;
  if (champ >= 0) {
    showOverlay(`<p class="muted">SHOWDOWN OVER</p><h2 class="${champ === 0 ? 'p1' : 'p2'}">🏆 PLAYER ${champ + 1}<br>RULES THE ROAD</h2>
      <div class="vs"><span class="p1">P1 ${G.wins[0]}</span><span>–</span><span class="p2">${G.wins[1]} P2</span></div>
      <p>Last round: <span class="p1">₹${r.a}</span> vs <span class="p2">₹${r.b}</span></p>
      <button class="btn red" data-a="play2" data-primary>⚔ REMATCH</button>
      <button class="btn ghost" data-a="menu">Menu</button>`);
  } else {
    G.round++;
    showOverlay(`<h2>${msg}</h2><div class="vs"><span class="p1">₹${r.a}</span><span>vs</span><span class="p2">₹${r.b}</span></div>
      <div class="vs"><span class="p1">P1 ${G.wins[0]} ★</span><span>–</span><span class="p2">★ ${G.wins[1]} P2</span></div>
      <button class="btn red" data-a="nextRound" data-primary>ROUND ${G.round} ▶</button>
      <button class="btn ghost" data-a="menu">Quit to menu</button>`);
  }
}
function showEnd(won, score, newBest) {
  const r = rankIndex(S.xp);
  const beatMsg = CHALLENGE ? (score > CHALLENGE.beat ? `<div class="banner">🏁 You beat ${esc(CHALLENGE.from)}'s ₹${CHALLENGE.beat}!</div>` : `<div class="banner">🏁 ${esc(CHALLENGE.from)}'s ₹${CHALLENGE.beat} still stands. One more night?</div>`) : '';
  const story = won
    ? `<p>Dawn on Dashami. The idols sail down the Ganga to the beat of a hundred dhaks. The malik counts every note, then pats the bonnet. <b>"One more year, old girl."</b></p><p><b>The last yellow Ambassador lives.</b></p>`
    : `<p>The tow truck arrives at sunrise. The malik won't look at you. Somewhere a ZipCab honks.</p><p><b>But Pujo comes every year. So do second chances.</b></p>`;
  showOverlay(`<div style="font-size:calc(var(--u)*60)">${won ? '🏆' : '🚧'}</div>
    <h2>${won ? 'THE TAXI LIVES!' : 'SCRAPPED!'}</h2>${story}
    <div class="big">₹${score}</div><p class="muted">total earned${newBest ? ' · <b class="ok">NEW BEST!</b>' : ' · best ₹' + S.best} · +${G.xpGained} XP · ${RANKS[r].name}${G.newCards ? ' · ' + G.newCards + ' new story card' + (G.newCards > 1 ? 's' : '') : ''}</p>
    ${beatMsg}
    <button class="btn" data-a="play1" data-primary>${won ? 'PLAY AGAIN' : 'TRY AGAIN'} ▶</button>
    <input class="name" id="cname" maxlength="20" placeholder="Your name for the challenge link">
    <button class="btn teal" data-a="challenge" data-score="${score}">🔗 Copy challenge link</button>
    <p class="tiny" id="cmsg"></p>
    <button class="btn ghost" data-a="menu">Menu</button>`);
}
function pause() {
  if (G.state !== 'play') return;
  G.state = 'paused';
  for (const k in keys) keys[k] = false;
  pointers.clear();
  showOverlay(`<h2>Paused</h2><button class="btn" data-a="resume" data-primary>▶ Resume</button>
    <button class="btn ghost" data-a="mute">${S.muted ? '🔇 Sound off' : '🔊 Sound on'}</button>
    <button class="btn ghost" data-a="quit">Quit to menu</button>`);
}
function resume() { if (G.state !== 'paused') return; hideOverlay(); G.state = 'play'; last = performance.now(); }

const ACTIONS = {
  play1: () => startStory(),
  play2: () => startShowdown(),
  journal: () => showJournal(),
  how: () => showHow(),
  menu: () => showMenu(),
  go: () => beginPlay(),
  resume: () => resume(),
  quit: () => showMenu(),
  mute: () => { setMuted(!S.muted); if (G.state === 'paused') { G.state = 'play'; pause(); } else showMenu(); },
  paintPrev: () => { const r = rankIndex(S.xp); S.paint = (Math.min(S.paint, r) + r) % (r + 1); save(); showMenu(); if (r === 0) flashLocked(); },
  paintNext: () => { const r = rankIndex(S.xp); S.paint = (Math.min(S.paint, r) + 1) % (r + 1); save(); showMenu(); if (r === 0) flashLocked(); },
  nextNight: () => { G.night++; showIntro(); },
  nextRound: () => showIntro(),
  buy: b => { const k = b.getAttribute('data-k'), u = UPGRADES[k], t = G.taxis[0]; const lv = G.up[k]; if (!u || lv >= u.max) return; const cost = u.cost[lv]; if (t.wallet < cost) return; t.wallet -= cost; G.up[k]++; SFX.coin(); showDawn(); },
  repair: () => { const t = G.taxis[0]; const cost = Math.ceil((100 - t.hp) * 1.5 / 5) * 5; if (t.wallet < cost) return; t.wallet -= cost; t.hp = 100; SFX.coin(); showDawn(); },
  challenge: b => {
    const score = parseInt(b.getAttribute('data-score'), 10) || 0;
    const nameEl = document.getElementById('cname');
    const name = ((nameEl && nameEl.value) || 'A friend').replace(/[^\p{L}\p{N} ._-]/gu, '').slice(0, 20) || 'A friend';
    const url = location.origin + location.pathname + '?beat=' + score + '&from=' + encodeURIComponent(name);
    const msg = document.getElementById('cmsg');
    const done = ok => { if (msg) msg.textContent = ok ? 'Copied! Send it to a friend.' : url; };
    try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(() => done(true), () => done(false)); else done(false); }
    catch (e) { done(false); }
  },
};
function flashLocked() {
  const p = overlay.querySelector('.paint span');
  if (p) p.innerHTML += ' <span class="muted">· earn XP to unlock more paints</span>';
}

// ---------------------------------------------------------------- boot
// Debug/test hook (used by automated tests; harmless for players)
window.__PNR = { G, S, keys, startStory, startShowdown, beginPlay, endNight, ACTIONS, step: (n, dt) => { for (let i = 0; i < n; i++) update(dt); draw(); } };
showMenu();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
