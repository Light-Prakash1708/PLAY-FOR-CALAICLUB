const pointers = new Map();

function touchButtons() {

    return [
      { id: 0, act: 'l', x: 12, y, w: 74, h: s, label: '◀' }, { id: 0, act: 'r', x: 92, y, w: 74, h: s, label: '▶' }, { id: 0, act: 'h', x: 172, y, w: 74, h: s, label: 'HONK' },
      { id: 1, act: 'l', x: W - 246, y, w: 74, h: s, label: '◀' }, { id: 1, act: 'r', x: W - 166, y, w: 74, h: s, label: '▶' }, { id: 1, act: 'h', x: W - 86, y, w: 74, h: s, label: 'HONK' },

    { id: 0, act: 'l', x: 14, y, w: s, h: s, label: '◀' }, { id: 0, act: 'r', x: 14 + s + 10, y, w: s, h: s, label: '▶' },
    { id: 0, act: 'u', x: W - 2 * s - 24, y, w: s, h: s, label: 'BOOST' }, { id: 0, act: 'h', x: W - s - 14, y, w: s, h: s, label: 'HONK' },

function touchInput(idx) {
  const out = { ix: 0, iy: 0, horn: false };
  if (!touchMode || pointers.size === 0) return out;
  const btns = touchButtons();
  for (const p of pointers.values()) for (const b of btns) {
    if (b.id !== idx) continue;
    if (inRect(p, { x: b.x - 6, y: b.y - 10, w: b.w + 12, h: b.h + 20 })) {
      if (b.act === 'l') out.ix -= 1; else if (b.act === 'r') out.ix += 1; else if (b.act === 'u') out.iy -= 1; else if (b.act === 'h') out.horn = true;

  let ix = 0, iy = 0, horn = false;

  for (const k of sets) {
    if (k.l.some(c => keys[c])) ix -= 1;
    if (k.r.some(c => keys[c])) ix += 1;
    if (k.u.some(c => keys[c])) iy -= 1;
    if (k.d.some(c => keys[c])) iy += 1;

    case 'tram':

      lane = TRAM_LANE;
      o = { kind: 'tram', lane, x: laneX(lane), y: -120, w: 58, h: 200, own: 0.35, dmg: 1 };

      break;
    case 'cow':
      lane = freeLane([0, 1, 2, 3]); if (lane < 0) return;

      break;
    case 'pot':

    case 'mishti':

      break;
    case 'crowd': {
      const side = randi(0, 1), w = LANE_W * 1.25, x = side === 0 ? ROAD_L + w / 2 : ROAD_R - w / 2;
      const people = [];
      for (let i = 0; i < 24; i++) people.push({ dx: rand(-w / 2 + 8, w / 2 - 8), dy: rand(-50, 50), c: pick(['#e74c3c', '#f1c40f', '#9b59b6', '#3498db', '#e67e22', '#1abc9c', '#fd79a8', '#fff']), ph: rand(0, 6) });
      o = { kind: 'crowd', lane: EDGE_LANE[side], x, y: -70, w, h: 120, own: 0, flat: true, people, side };
      break;
    }
    case 'zip':
      lane = randi(0, 3);

      break;
    case 'pass': {

      G.waiting.push({ x: CURB_X[side], y: -30, side, ch: pick(pool), ph: rand(0, 6), state: null });
      return;
    }
  }
  if (o) { o.vx = o.vx || 0; o.dy = 0; o.t = 0; G.objs.push(o); }
}
function runSpawners(dt) {
  const c = G.cfg, ramp = 1 - 0.25 * G.t / G.len;
  for (const k of ['traffic', 'bus', 'rick', 'tram', 'cow', 'pot', 'crowd', 'zip', 'pass', 'mishti']) {
    const base = c[k]; if (!base) continue;
    G.sp[k] -= dt;
    if (G.sp[k] <= 0) { spawn(k); G.sp[k] = base * rand(0.7, 1.3) * (k === 'pass' || k === 'mishti' ? 1 : ramp); }
  }
  // landmarks along tonight's route
  const times = c.routeT || ROUTE_T;
  if (c.route && G.routeIdx < c.route.length && G.t >= times[G.routeIdx]) {
    const id = c.route[G.routeIdx], def = LM[id];
    const len = def.style === 'bridge' ? 1100 : 300;
    const side = def.style === 'ghat' || def.style === 'water' ? 1 : (G.routeIdx % 2);
    G.sets.push({ id, def, y: -len / 2 - 40, len, side, shown: false, t: 0 });
    G.routeIdx++;
  }
}

// ---------------------------------------------------------------- effects
function addFloat(x, y, text, color = '#fff', size = 22, life = 1.2) { G.floats.push({ x, y, text, color, size, life, max: life }); }
function burst(x, y, n, colors, spd = 220, size = 4, life = 0.7, kind = 'dot') {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(spd * 0.3, spd);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * 0.6, life), max: life, c: pick(colors), size: rand(size * 0.6, size), kind, rot: rand(0, 6), vr: rand(-8, 8) });

}
function smoke(x, y, c = '#555') { G.parts.push({ x, y, vx: rand(-20, 20), vy: rand(-60, -20), life: 0.9, max: 0.9, c, size: rand(6, 11), kind: 'smoke', rot: 0, vr: 0 }); }
function cinematicHit(x, y, slow = 0.45, zoom = 0.14) { G.slow = Math.max(G.slow, slow); G.zoomPulse = Math.max(G.zoomPulse, zoom); G.focus = { x, y }; }

// ---------------------------------------------------------------- hearts / damage
function loseHeart(t, msg, halves = 2) {
  if (t.stall > 0) return;
  if (t.shield > 0) { t.shield--; addFloat(t.x, t.y - 70, '🛡️ Bumper saved you!', '#7bed9f', 17, 1.2); return; }
  t.hearts = Math.max(0, t.hearts - halves);
  G.flash = 0.25;
  addFloat(t.x, t.y - 70, msg || '−❤', '#ff4757', 22, 1.2);
  if (t.hearts <= 0) towed(t);
}
function towed(t) {
  addFloat(t.x, t.y - 40, 'TOWED!', '#ff4757', 34, 1.8);
  TTS.say('towed', { force: true, pitch: 0.8 });
  SFX.crash(); cinematicHit(t.x, t.y, 0.8, 0.2);
  if (t.pass) { clearZone(t); t.pass = null; }
  if (G.mode === '1p') { G.towed = true; G.endT = 1.1; }
  else { t.stall = 3; t.inv = 4.5; t.hearts = MAX_HALF; }
}
function crash(t, kind) {
  G.st.crashes++;
  G.shake = Math.min(14, G.shake + 9);
  if (t.pass) {
    if (t.pass.type === 'fragile') loseFare(t, t.pass.ch.cargo === 'CAKE' ? 'THE CAKE! RUINED!' : 'THE IDOL CRACKED!', '#ff4757');
    else { t.pass.mood -= t.pass.type === 'granny' ? 40 : 22; if (t.pass.type === 'granny') TTS.say('aste', { pitch: 1.5, rate: 0.95 }); if (t.pass.mood <= 0) loseFare(t, 'Ami nemey jabo! (I’m getting off!)'); }
  }
  const big = kind === 'bus' || kind === 'tram';
  loseHeart(t, kind === 'cow' ? 'Moo! −½❤' : big ? '−❤' : '−½❤', big ? 2 : 1);
  if (kind !== 'cow' && kind !== 'zip') offense(t, 'Hit-and-run!');
}

// ---------------------------------------------------------------- police
function offense(t, why) {
  if (G.mode === '1p' && G.night === 0 && G.t < 12) return; // grace period while learning
  t.wanted = Math.min(3, t.wanted + 1); t.calm = 0;
  addFloat(t.x, t.y - 92, '🚨 ' + why, '#74b9ff', 16, 1.2);
  SFX.whistle();
  const mine = G.police.filter(p => p.target === t && !p.leaving).length;
  for (let i = mine; i < t.wanted; i++) {
    const jeep = t.wanted >= 3 && i === 2;
    G.police.push({ kind: jeep ? 'jeep' : 'bike', x: clamp(t.x + rand(-80, 80), ROAD_L + 20, ROAD_R - 20), y: H + 60 + i * 50, vx: 0, w: jeep ? 40 : 18, h: jeep ? 66 : 38, target: t, stun: 0, leaving: false, ph: rand(0, 6) });
  }
  if (!t.chased) { TTS.say('police', { force: true, pitch: 0.75, rate: 1.15 }); t.chased = true; }
}
function updatePolice(dt) {
  const sc = G.cfg.scroll;
  for (const t of G.taxis) {
    if (t.wanted > 0) {
      t.calm += dt;
      if (t.calm > 9) {
        t.wanted--; t.calm = 5;
        if (t.wanted === 0) {
          for (const p of G.police) if (p.target === t) p.leaving = true;
          if (t.chased) { G.st.escape++; addFloat(t.x, t.y - 80, 'ESCAPED THE POLICE!', '#7bed9f', 24, 1.6); TTS.say('escaped'); S.xp += 10; G.xpGained += 10; t.chased = false; }
        }
      }
    }
  }
  for (const p of G.police) {
    p.ph += dt;
    if (p.leaving) { p.y += 260 * dt; continue; }
    const t = p.target;
    if (p.stun > 0) { p.stun -= dt; p.y += sc * 0.6 * dt; continue; }
    const spd = p.kind === 'jeep' ? 195 : 220;
    p.vx += (t.x - p.x) * 6 * dt; p.vx *= Math.exp(-3.5 * dt); p.vx = clamp(p.vx, -320, 320);
    p.x = clamp(p.x + p.vx * dt, ROAD_L + 12, ROAD_R - 12);
    const dy = t.y - p.y;
    p.y += clamp(dy, -spd * dt, spd * dt * 0.6);
    for (const o of G.objs) {
      if (o.kind === 'crowd' && overlapR(p, o)) { p.y += 160 * dt; continue; }
      if (o.flat) continue;
      if (overlapR(p, o, 0.8)) { p.stun = 1.4; burst(p.x, p.y, 10, ['#fff', '#74b9ff'], 200, 4, 0.5); addFloat(p.x, p.y - 30, 'Police crashed!', '#74b9ff', 14, 0.9); SFX.bump(); break; }
    }
    if (Math.hypot(t.x - p.x, t.y - p.y) < 40 && t.stall <= 0 && t.inv <= 0) caught(t);
  }
  G.police = G.police.filter(p => p.y < H + 140 && p.y > -200);
}
function caught(t) {
  const fine = Math.min(t.wallet, G.mode === '1p' ? 80 : 50);
  t.wallet -= fine; t.inv = 2; t.stun = 1.2; t.vx *= 0.2;
  if (G.mode === '1p') G.totalEarned = Math.max(0, G.totalEarned - fine);
  addFloat(t.x, t.y - 60, 'CAUGHT! Fine −₹' + fine, '#74b9ff', 24, 1.6);
  TTS.say('fine', { force: true, pitch: 0.7 });
  SFX.whistle(); cinematicHit(t.x, t.y, 0.6, 0.18);
  t.wanted = 0; t.chased = false;
  for (const p of G.police) if (p.target === t) p.leaving = true;
}

// ---------------------------------------------------------------- passengers & fares
function board(t, w) {
  const ty = TYPE[w.ch.type], ride = w.ride != null ? w.ride : rand(ty.ride[0], ty.ride[1]);
  t.pass = { ch: w.ch, type: w.ch.type, mood: w.mood != null ? w.mood : 100, ride, meter: w.meter != null ? w.meter : ride + ty.extra, meterMax: ride + ty.extra,
    zone: null, base: Math.round((55 + ride * 7) * ty.mult / 5) * 5 };
  SFX.pickup();
  addFloat(t.x, t.y - 50, w.ch.type === 'howrah' ? 'Howrah! ×2 fare' : 'Hop in!', '#fff', 20);
  if (w.ch.type === 'howrah') { G.st.howrah++; TTS.say('jaben', { pitch: 0.9 }); }
  else if (w.ch.type === 'granny') TTS.say('aste', { pitch: 1.5, rate: 0.9 });
  else TTS.say('hopin', { pitch: 1 + Math.random() * 0.4 });
}
function dropToCurb(t, ch, extra) {
  const side = t.x < (ROAD_L + ROAD_R) / 2 ? 0 : 1;
  G.waiting.push(Object.assign({ x: CURB_X[side], y: clamp(t.y, HUD_H + 40, H - 40), side, ch, ph: 0, state: 'ejected', stateT: 0.8 }, extra || {}));
}
function clearZone(t) { if (t.pass && t.pass.zone) G.zones = G.zones.filter(z => z !== t.pass.zone); }
function loseFare(t, msg, color = '#ff7675') { if (!t.pass) return; clearZone(t); addFloat(t.x, t.y - 60, msg, color, 20, 1.6); t.pass = null; SFX.lost(); }
function spawnZone(t) {
  const other = G.zones.find(z => z.owner !== t);
  let side = randi(0, 1);
  if (other && Math.random() < 0.5) side = other.side;
  const z = { owner: t, side, y: -60, h: 110, ph: 0 };
  G.zones.push(z); t.pass.zone = z;
}
function deliver(t) {
  const p = t.pass, fare = p.base;
  let tip = p.mood > 70 ? Math.round(fare * 0.35) : p.mood > 40 ? Math.round(fare * 0.12) : 0;
  if (p.type === 'rush' && p.meter > p.meterMax * 0.35) tip += 40;
  const total = fare + tip;
  t.wallet += total; t.earned += total; t.nightEarned += total; t.deliveries++;
  G.st.del++; G.st.earn += total; if (p.type === 'fragile') G.st.fragile++;
  if (G.mode === '1p') G.totalEarned += total;
  addFloat(t.x, t.y - 60, '+₹' + fare, '#ffe066', 30, 1.4);
  if (tip > 0) addFloat(t.x, t.y - 95, (p.mood > 70 ? 'Happy tip ' : 'Tip ') + '+₹' + tip, '#7bed9f', 18, 1.4);
  burst(t.x, t.y, 26, ['#ff9f1a', '#ffd32a', '#ff6b00', '#ffffff'], 260, 7, 1.1, 'petal');
  SFX.coin(); TTS.say('thanks', { pitch: 1 + Math.random() * 0.3 });
  const xp = 10 + (p.type !== 'normal' ? 5 : 0); S.xp += xp; G.xpGained += xp;
  if (!S.journal[p.ch.id]) { S.journal[p.ch.id] = true; G.newCards++; addFloat(W / 2, HUD_H + 80, 'NEW STORY CARD: ' + p.ch.name, '#f6c324', 18, 2); }
  save();
  if (!G.nightStories.includes(p.ch)) G.nightStories.push(p.ch);
  clearZone(t); t.pass = null;
}
function breakdownEject(t) { if (t.pass) { const ch = t.pass.ch; clearZone(t); t.pass = null; dropToCurb(t, ch); } }

function horn(t) {
  t.hornCd = G.mode === '1p' ? 3.4 - 0.7 * G.up.horn : 3;
  t.hornFx = 0.35;
  SFX.horn();
  const R = 125;
  const push = (o, f) => { const dx = o.x - t.x, dy = o.y - t.y, d = Math.hypot(dx, dy) || 1; if (d > R) return false; o.vx = (o.vx || 0) + dx / d * f; if (o.kind === 'zip') o.y += dy / d * 18; return true; };
  for (const o of G.objs) {
    if (o.kind === 'zip' && push(o, 520)) { if (!o.honked) { o.honked = true; G.st.ziphonk++; } o.target = null; addFloat(o.x, o.y - 40, 'Hey!', '#fff', 16, 0.8); }
    else if (o.kind === 'cow' && push(o, 160)) { o.bubbleT = 1.2; SFX.moo(); }
    else if (o.kind === 'car' || o.kind === 'rick' || o.kind === 'oldtaxi') push(o, 140);
  }
  for (const o of G.taxis) {
    if (o === t) continue;
    const dx = o.x - t.x, dy = o.y - t.y, d = Math.hypot(dx, dy) || 1;
    if (d < R) { o.vx += dx / d * 480; o.vy += dy / d * 260; o.stun = 0.35; addFloat(o.x, o.y - 40, 'HONKED!', P_COLORS[t.idx], 16, 0.8); }
  }
  for (const p of G.police) { if (!p.leaving && Math.hypot(p.x - t.x, p.y - t.y) < R && t.wanted < 3) { offense(t, 'Honked at police?!'); break; } }
  if (G.boss && !G.boss.leaving) { const b = G.boss, dx = b.x - t.x, dy = b.y - t.y, d = Math.hypot(dx, dy) || 1; if (d < R + 20) { b.vx += dx / d * 380; b.timer = Math.max(b.timer, 0.8); b.phase = 'stalk'; } }
  for (let i = 0; i < 3; i++) G.parts.push({ x: t.x, y: t.y, vx: 0, vy: 0, life: 0.35 + i * 0.08, max: 0.35 + i * 0.08, c: P_COLORS[t.idx], size: 20, kind: 'ring', rot: 0, vr: 0 });
}

// ---------------------------------------------------------------- update
function updateTaxi(t, dt) {
  t.hornCd = Math.max(0, t.hornCd - dt); t.inv = Math.max(0, t.inv - dt); t.stealCd = Math.max(0, t.stealCd - dt);
  t.stun = Math.max(0, t.stun - dt); t.hornFx = Math.max(0, t.hornFx - dt);
  let inp = readInput(t);
  if (G.cine > 1.2) inp = { ix: 0, iy: 0, horn: false };
  if (t.stall > 0) {
    t.stall -= dt; inp = { ix: 0, iy: 0, horn: false };
    if (Math.random() < 0.6) smoke(t.x + rand(-8, 8), t.y - 20);
    if (t.stall <= 0) addFloat(t.x, t.y - 40, 'Back on the road!', '#7bed9f', 16);
  }
  if (t.stun > 0) { inp.ix *= 0.25; inp.iy *= 0.25; }
  const spd = G.mode === '1p' ? 1 + 0.12 * G.up.engine : 1.06;
  const grip = G.cfg.rain ? 3.6 : 6.5;
  t.vx += inp.ix * (G.cfg.rain ? 1500 : 1900) * spd * dt;
  t.vx *= Math.exp(-grip * dt);
  t.vx = clamp(t.vx, -360 * spd, 360 * spd);
  if (inp.iy !== 0) t.vy += inp.iy * 1400 * spd * dt; else t.vy += (t.homeY - t.y) * 4 * dt;
  if (t.inCrowd) { t.vy += 700 * dt; t.vx *= Math.exp(-4 * dt); }
  if (t.stall > 0) t.vy = 110;
  t.vy *= Math.exp(-5 * dt); t.vy = clamp(t.vy, -400, 400);
  t.x += t.vx * dt; t.y += t.vy * dt;
  const minX = ROAD_L + 19, maxX = ROAD_R - 19;
  if (t.x < minX) { t.x = minX; t.vx = Math.abs(t.vx) * 0.3; }
  if (t.x > maxX) { t.x = maxX; t.vx = -Math.abs(t.vx) * 0.3; }
  t.y = clamp(t.y, HUD_H + 110, H - 70);
  t.tilt = lerp(t.tilt, t.vx / 360 * 0.28, Math.min(1, dt * 10));
  if (inp.iy < 0 && Math.random() < 0.5) G.parts.push({ x: t.x + rand(-14, 14), y: t.y + 34, vx: 0, vy: 240, life: 0.25, max: 0.25, c: 'rgba(255,255,255,.6)', size: 2, kind: 'line', rot: 0, vr: 0 });
  if (inp.horn && !t.hornHeld && t.hornCd <= 0 && t.stall <= 0) horn(t);
  t.hornHeld = inp.horn;
  const p = t.pass;
  if (p) {
    p.meter -= dt;
    p.mood = Math.max(0, p.mood - dt * (p.type === 'granny' ? 2 : 1.3) - (t.inCrowd ? dt * 6 : 0));
    if (!p.zone) { p.ride -= dt; if (p.ride <= 0) spawnZone(t); }
    if (p.meter <= 0) loseFare(t, 'Meter ran out! Passenger left!');
  }
}
function updateObjs(dt) {
  const sc = G.cfg.scroll;
  for (const o of G.objs) { o.t += dt; o.dy = sc * (1 - o.own); }
  for (const a of G.objs) {
    if (a.flat) continue;
    for (const b of G.objs) {
      if (a === b || b.flat || Math.abs(a.x - b.x) > 42) continue;
      if (a.dy > 0 && a.y < b.y && a.y + a.h / 2 + 14 > b.y - b.h / 2 && a.dy > b.dy) a.dy = b.dy;
      if (a.kind === 'zip' && a.y > b.y && a.y - a.h / 2 - 14 < b.y + b.h / 2 && a.dy < b.dy) a.dy = Math.min(b.dy, sc * 0.2);
    }
  }
  for (const o of G.objs) {
    if (o.kind === 'zip') updateZip(o, dt);
    else if (!o.flat) {
      if (o.kind === 'cow') { o.x += o.wander * dt; if (o.x < ROAD_L + 25 || o.x > ROAD_R - 25) o.wander *= -1; o.bubbleT = Math.max(0, o.bubbleT - dt); }
      else o.x += (laneX(o.lane) - o.x) * 1.5 * dt;
      o.x += o.vx * dt; o.vx *= Math.exp(-4 * dt);
      if (o.kind === 'bus') { o.bubbleT = Math.max(0, o.bubbleT - dt); if (o.bubble && !o.said && o.y > 200 && o.bubble.startsWith('Aste')) { o.said = true; TTS.say('conductor', { pitch: 1.2, rate: 1.25 }); } }
    }
    o.y += o.dy * dt;
  }
  G.objs = G.objs.filter(o => o.y < H + 260 && o.y > -320);
}
function updateZip(o, dt) {
  if (!o.target || !G.waiting.includes(o.target) || o.target.y > o.y + 20) {
    o.target = null; let best = 1e9;
    for (const w of G.waiting) { if (w.state === 'ejected') continue; const d = o.y - w.y; if (d > 30 && d < 520 && d < best) { best = d; o.target = w; } }
  }
  let tx = o.target ? laneX(EDGE_LANE[o.target.side]) : laneX(o.lane);
  for (const b of G.objs) { if (b === o || b.flat) continue; if (b.y < o.y && o.y - b.y < 150 && Math.abs(b.x - o.x) < 46) { tx = o.x + (o.x < (ROAD_L + ROAD_R) / 2 ? 90 : -90); break; } }
  o.vx += (tx - o.x) * 5 * dt; o.vx *= Math.exp(-3 * dt); o.vx = clamp(o.vx, -300, 300);
  o.x = clamp(o.x + o.vx * dt, ROAD_L + 19, ROAD_R - 19);
  if (o.target && Math.abs(o.y - o.target.y) < 42 && Math.abs(o.x - laneX(EDGE_LANE[o.target.side])) < 50) {
    const w = o.target; G.waiting = G.waiting.filter(q => q !== w);
    addFloat(o.x, o.y - 40, 'ZipCab stole a fare!', '#55efc4', 17, 1.3);
    o.target = null; o.own += 0.25;
  }
}
function updateWaiting(dt) {
  const sc = G.cfg.scroll;
  for (const w of G.waiting) {
    w.y += sc * dt; w.ph += dt;
    if (w.state === 'ejected') { w.stateT -= dt; if (w.stateT <= 0) w.state = null; continue; }
    for (const t of G.taxis) {
      if (t.pass || t.stall > 0) continue;
      if (Math.abs(t.x - laneX(EDGE_LANE[w.side])) < 52 && Math.abs(t.y - w.y) < 55) { board(t, w); w.gone = true; break; }
    }
  }
  G.waiting = G.waiting.filter(w => !w.gone && w.y < H + 40);
}
function updateZones(dt) {
  const sc = G.cfg.scroll;
  for (const z of G.zones) {
    z.y += sc * dt; z.ph += dt;
    const t = z.owner;
    if (!t.pass || t.pass.zone !== z) { z.dead = true; continue; }
    if (Math.abs(t.x - laneX(EDGE_LANE[z.side])) < 60 && Math.abs(t.y - z.y) < z.h / 2 + 18 && t.stall <= 0) { deliver(t); z.dead = true; continue; }

    <p>❤️ You have <b>3 hearts</b>. Bumps cost ½ a heart, buses and trams a whole one. Grab <b>মিষ্টি</b> boxes to heal. Lose all three and you're <b>towed</b>.</p>
    <p>🚨 Hit traffic and the <b>Kolkata Traffic Police</b> chase you. Lead them into traffic or wait them out. Caught = a fine.</p>
    <p>📯 <b>Honk</b> to shove ZipCabs, cows and rivals. (Not the police!)</p>
    <p>🗺️ Pass real <b>Kolkata landmarks and Pujo 2026 pandals</b>. Each one teaches you something.</p>
    <p>🎯 Two <b>side missions</b> each night, plus a 🪁 <b>Bhokatta</b> kite fight on the rooftop at dawn.</p>
    <p>😈 <b>Showdown:</b> ram your rival from the side to <b>steal their passenger!</b></p>
    ${controlsHTML()}
    <button class="btn" data-a="menu" data-primary>Got it</button>`);
}
function showJournal() {
  const html = CHARS.map(c => S.journal[c.id]
    ? `<div class="card"><span class="em">${c.emoji}</span><b>${esc(c.name)}</b>“${esc(c.story)}”</div>`
    : `<div class="card locked"><span class="em">❔</span><b>???</b>Deliver this passenger to unlock their story.</div>`).join('');
  showOverlay(`<h2>📖 Story Cards</h2><p class="muted">Every passenger has a story. Collect all ${CHARS.length}.</p><div class="cards">${html}</div><button class="btn" data-a="menu" data-primary>Back</button>`);
}
function showMap() {
  const ids = Object.keys(LM);
  const pts = ids.map(id => { const d = LM[id], [u, v] = d.map, seen = S.map[id]; return `<g><circle cx="${(u * 300).toFixed(1)}" cy="${(v * 380).toFixed(1)}" r="${seen ? 6 : 4}" fill="${seen ? (d.pujo ? '#e8442e' : '#1b1430') : '#b9a77c'}"/>${seen ? `<text x="${(u * 300 + 8).toFixed(1)}" y="${(v * 380 + 4).toFixed(1)}" font-size="9" font-weight="700" fill="#1b1430">${esc(d.name.split(' ·')[0].split(' (')[0])}</text>` : ''}</g>`; }).join('');
  const river = RIVER.map(([u, v], i) => (i ? 'L' : 'M') + (u * 300).toFixed(1) + ' ' + (v * 380).toFixed(1)).join(' ');
  const cards = ids.map(id => S.map[id] ? `<div class="card"><span class="em">${LM[id].icon}</span><b>${esc(LM[id].name)}</b>${esc(LM[id].fact)}</div>` : `<div class="card locked"><span class="em">❔</span><b>???</b>Drive past it in Story mode to discover it.</div>`).join('');
  showOverlay(`<h2>🗺️ Kolkata</h2><p class="muted">Durga Puja in Kolkata is on UNESCO's list of Intangible Cultural Heritage (2021). Discover the city one night at a time.</p>
    <svg class="mapsvg" viewBox="-10 -10 320 400"><path d="${river}" stroke="#5dade2" stroke-width="14" fill="none" stroke-linecap="round"/><text x="2" y="200" font-size="10" fill="#2c7da0" font-weight="900" transform="rotate(-70 20 200)">HOOGHLY (GANGA)</text>${pts}</svg>
    <div class="cards">${cards}</div><button class="btn" data-a="menu" data-primary>Back</button>`);
}
function showIntro() {
  G.state = 'intro';
  if (G.mode === '1p') {
    const n = NIGHTS[G.night];
    const ms = MISSIONS[G.night].map(m => `<div class="mis">🎯 ${esc(m.text)} <b style="float:right">+₹${m.reward}</b></div>`).join('');
    const route = n.route.map(id => LM[id].name.split(' ·')[0].split(' (')[0]).join(' → ');
    showOverlay(`<p class="muted">NIGHT ${G.night + 1} OF 5</p><h2>${n.name}</h2><div class="bn">${n.bn}</div>
      <div class="banner">The malik wants <b>₹${n.rent}</b> by dawn</div>
      <p class="muted">🗺️ ${esc(route)}</p>
      <p><b>${esc(n.tip)}</b></p>
      <h3>Side missions</h3>${ms}
      ${G.night === 0 ? controlsHTML() : ''}
      <button class="btn" data-a="go" data-primary>START THE NIGHT ▶</button>`);
  } else {
    showOverlay(`<p class="muted">FIRST TO 2 ROUNDS WINS</p><h2>Round ${G.round}</h2>
      <div class="vs"><span class="p1">P1 ${G.wins[0]}</span><span>–</span><span class="p2">${G.wins[1]} P2</span></div>
      <p><b>Most money in 60 seconds wins.</b> Ram your rival from the side to <b>steal their passenger</b>. But ramming brings the <b>police</b> after you!</p>
      ${controlsHTML()}
      <button class="btn red" data-a="go" data-primary>FIGHT! ▶</button>`);
  }
}
function showDawn() {
  const t = G.taxis[0], r = G.lastResult, next = NIGHTS[G.night + 1];
  const stories = G.nightStories.slice(0, 4).map(c => `<div class="card"><span class="em">${c.emoji}</span><b>${esc(c.name)}</b>“${esc(c.story)}”</div>`).join('');
  const ms = r.ms.map(m => `<div class="mis">${m.done ? '✅' : '❌'} ${esc(m.text)} <b style="float:right">${m.done ? '+₹' + m.reward : '—'}</b></div>`).join('');
  const shop = Object.keys(UPGRADES).map(k => {
    const u = UPGRADES[k], lv = G.up[k];
    if (lv >= u.max) return `<button class="btn ghost" disabled>${u.icon} ${u.name} MAX</button>`;
    const cost = u.cost[lv];
    return `<button class="btn ghost" data-a="buy" data-k="${k}" ${t.wallet < cost ? 'disabled' : ''}>${u.icon} ${u.name} Lv${lv + 1}<br><span class="muted">${u.desc} · ₹${cost}</span></button>`;
  }).join('');
  showOverlay(`<p class="muted">🌅 DAWN AFTER ${G.cfg.name.toUpperCase()}${r.towed ? ' · TOWED EARLY' : ''}</p>
    <p>Fares: <b>₹${r.tonight}</b> · Missions: <b>₹${r.bonus}</b> · Rent: <b>₹${r.rent}</b></p>
    <div class="big ${r.paid ? 'ok' : 'bad'}">${r.paid ? 'RENT PAID ✅' : 'STRIKE ' + G.strikes + '/3 ❌'}</div>
    <p class="muted">${r.paid ? 'The malik counts the notes twice. "Thik ache. Kal abar." The taxi lives another night.' : 'The malik shakes his head. "One more miss and she goes to the scrapyard."'}</p>
    <h3>Side missions</h3>${ms}
    ${G.kiteDone ? `<div class="banner">🪁 Rooftop kite fight: +₹${G.kiteReward || 0}</div>` : `<button class="btn teal" data-a="kite">🪁 ROOFTOP SIDE MISSION: BHOKATTA!<br><span class="muted">cut kites for ₹40 each</span></button>`}
    ${stories ? `<h3>Passengers tonight</h3><div class="cards">${stories}</div>` : ''}
    <h3>Garage · savings ₹${t.wallet}</h3>
    <div class="shop">
      ${shop}
    </div>
    <p class="muted">The mechanic refills your 3 hearts every night. Savings count toward tomorrow's rent.</p>
    <button class="btn" data-a="nextNight" data-primary>${next.name.toUpperCase()} NIGHT ▶ (rent ₹${next.rent})</button>`);
}
function showRound() {
  const r = G.lastResult, champ = G.wins[0] >= 2 ? 0 : G.wins[1] >= 2 ? 1 : -1;
  const msg = r.w < 0 ? 'DRAW!' : `<span class="${r.w === 0 ? 'p1' : 'p2'}">PLAYER ${r.w + 1} WINS THE ROUND</span>`;
  if (champ >= 0) {
    showOverlay(`<p class="muted">SHOWDOWN OVER</p><h2 class="${champ === 0 ? 'p1' : 'p2'}">🏆 PLAYER ${champ + 1}<br>RULES THE ROAD</h2>
      <div class="vs"><span class="p1">P1 ${G.wins[0]}</span><span>–</span><span class="p2">${G.wins[1]} P2</span></div>
      <p>Last round: <span class="p1">₹${r.a}</span> vs <span class="p2">₹${r.b}</span></p>
      <button class="btn red" data-a="play2" data-primary>⚔ REMATCH</button><button class="btn ghost" data-a="menu">Menu</button>`);
  } else {
    G.round++;
    showOverlay(`<h2>${msg}</h2><div class="vs"><span class="p1">₹${r.a}</span><span>vs</span><span class="p2">₹${r.b}</span></div>
      <div class="vs"><span class="p1">P1 ${G.wins[0]} ★</span><span>–</span><span class="p2">★ ${G.wins[1]} P2</span></div>
      <button class="btn red" data-a="nextRound" data-primary>ROUND ${G.round} ▶</button><button class="btn ghost" data-a="menu">Quit to menu</button>`);
  }
}
function showEnd(won, score, newBest) {
  const r = rankIndex(S.xp);
  const beatMsg = CHALLENGE ? (score > CHALLENGE.beat ? `<div class="banner">🏁 You beat ${esc(CHALLENGE.from)}'s ₹${CHALLENGE.beat}!</div>` : `<div class="banner">🏁 ${esc(CHALLENGE.from)}'s ₹${CHALLENGE.beat} still stands. One more night?</div>`) : '';
  const story = won
    ? `<p>Dawn on Dashami at Babughat. The idols sail down the Ganga to the beat of a hundred dhaks: <i>"Asche bochor abar hobe!"</i> The malik counts every note, then pats the bonnet. <b>"One more year, old girl."</b></p><p><b>The last yellow Ambassador lives.</b></p>`
    : `<p>The tow truck arrives at sunrise. The malik won't look at you. Somewhere a ZipCab honks.</p><p><b>But Pujo comes every year. So do second chances.</b></p>`;
  showOverlay(`<div style="font-size:calc(var(--u)*58)">${won ? '🏆' : '🚧'}</div>
    <h2>${won ? 'THE TAXI LIVES!' : 'SCRAPPED!'}</h2>${story}
    <div class="big">₹${score}</div><p class="muted">total earned${newBest ? ' · <b class="ok">NEW BEST!</b>' : ' · best ₹' + S.best} · +${G.xpGained} XP · ${RANKS[r].name} · 🗺️ ${Object.keys(S.map).filter(k => LM[k]).length}/${Object.keys(LM).length} places</p>
    ${beatMsg}
    <button class="btn" data-a="play1" data-primary>${won ? 'PLAY AGAIN' : 'TRY AGAIN'} ▶</button>
    <input class="name" id="cname" maxlength="20" placeholder="Your name for the challenge link">
    <button class="btn teal" data-a="challenge" data-score="${score}">🔗 Copy challenge link</button>
    <p class="tiny" id="cmsg"></p>
    <button class="btn ghost" data-a="menu">Menu</button>`);
}
function pause() {
  if (G.state !== 'play') return;
  G.state = 'paused';
  for (const k in keys) keys[k] = false;
  pointers.clear(); TTS.stop();
  showOverlay(`<h2>Paused</h2><button class="btn" data-a="resume" data-primary>▶ Resume</button>
    <button class="btn ghost" data-a="mute">${S.muted ? '🔇 Sound off' : '🔊 Sound on'}</button>
    <button class="btn ghost" data-a="quit">Quit to menu</button>`);
}
function resume() { if (G.state !== 'paused') return; hideOverlay(); G.state = 'play'; last = performance.now(); }
const ACTIONS = {
  play1: () => startStory(), play2: () => startShowdown(), journal: () => showJournal(), map: () => showMap(), how: () => showHow(), menu: () => showMenu(),
  go: () => beginPlay(), resume: () => resume(), quit: () => { TTS.stop(); showMenu(); },
  mute: () => { setMuted(!S.muted); if (G.state === 'paused') { G.state = 'play'; pause(); } else showMenu(); },
  voice: () => { S.voice = !S.voice; save(); if (S.voice) TTS.say('jaben', { force: true }); else TTS.stop(); showMenu(); },
  paintPrev: () => { const r = rankIndex(S.xp); S.paint = (Math.min(S.paint, r) + r) % (r + 1); save(); showMenu(); if (r === 0) flashLocked(); },
  paintNext: () => { const r = rankIndex(S.xp); S.paint = (Math.min(S.paint, r) + 1) % (r + 1); save(); showMenu(); if (r === 0) flashLocked(); },
  nextNight: () => { G.night++; showIntro(); },
  nextRound: () => showIntro(),
  kite: () => startKite(),
  kitefree: () => { G.kiteFree = true; startKite(); },
  buy: b => { const k = b.getAttribute('data-k'), u = UPGRADES[k], t = G.taxis[0]; const lv = G.up[k]; if (!u || lv >= u.max) return; const cost = u.cost[lv]; if (t.wallet < cost) return; t.wallet -= cost; G.up[k]++; SFX.coin(); showDawn(); },
  challenge: b => {
    const score = parseInt(b.getAttribute('data-score'), 10) || 0, nameEl = document.getElementById('cname');
    const name = ((nameEl && nameEl.value) || 'A friend').replace(/[^\p{L}\p{N} ._-]/gu, '').slice(0, 20) || 'A friend';
    const url = location.origin + location.pathname + '?beat=' + score + '&from=' + encodeURIComponent(name);
    const msg = document.getElementById('cmsg'), done = ok => { if (msg) msg.textContent = ok ? 'Copied! Send it to a friend.' : url; };
    try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(() => done(true), () => done(false)); else done(false); } catch (e) { done(false); }
  },
};
function flashLocked() { const p = overlay.querySelector('.paint span'); if (p) p.innerHTML += ' <span class="muted">· earn XP to unlock</span>'; }

// ---------------------------------------------------------------- boot
window.__PNR = { G, S, keys, KITE, startStory, startShowdown, beginPlay, endNight, startKite, ACTIONS, step: (n, dt) => { for (let i = 0; i < n; i++) update(dt); draw(); } };
showMenu();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
